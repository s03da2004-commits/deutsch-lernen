<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الألماني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1f26;--mute:#6a707c;--line:#dcd8cf;
--m:#1d5fd1;--f:#d62839;--n:#1f9d55;--v:#111;--a:#7b3fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1e222a;--ink:#eef0f4;--mute:#9aa1ae;--line:#323845;--m:#5b9bff;--f:#ff6b7a;--n:#4cd08a;--v:#f2f2f2;--a:#b58cff}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1e222a;--ink:#eef0f4;--mute:#9aa1ae;--line:#323845;--m:#5b9bff;--f:#ff6b7a;--n:#4cd08a;--v:#f2f2f2;--a:#b58cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Cairo,Tahoma,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px}
:focus-visible{outline:3px solid var(--m);outline-offset:3px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:900;flex:1}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 16px;font:700 15px Cairo,sans-serif;cursor:pointer}
.crumb{color:var(--mute);margin:0 0 22px;font-size:15px}
.grid{display:grid;gap:14px}
.levels{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lessons{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--ink);font:700 18px Cairo,sans-serif}
.box:hover{border-color:var(--ink)}
.lvl{font-size:56px;font-weight:900;display:block;line-height:1.1}
.lvl+small{color:var(--mute);font-weight:500}
.num{display:block;color:var(--mute);font-size:14px;font-weight:500}
.cat{border-width:2px;border-color:currentColor}
.words{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.w{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
.w .de{direction:ltr;text-align:right;font-size:24px;font-weight:700}
.w .ar{color:var(--mute);font-size:16px}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:currentColor;cursor:pointer;display:grid;place-items:center;flex:none}
.spk svg{fill:var(--card);width:22px;height:22px}
.m{color:var(--m)}.f{color:var(--f)}.n{color:var(--n)}.v{color:var(--v)}.a{color:var(--a)}
.empty{color:var(--mute);background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.w{flex-wrap:wrap}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:0;flex:1;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-width:0}
.row .ar::after{content:" \25BE";font-size:13px}
.open .row .ar::after{content:" \25B4"}
.ex{display:none;flex-basis:100%;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--mute)}
.open .ex{display:grid}
.exde{direction:ltr;text-align:left;font-size:20px;font-weight:600;color:var(--ink)}
.exar{grid-column:1;color:var(--mute);font-size:15px}
.spk.sm{grid-row:1/3;grid-column:2;width:34px;height:34px}
.spk.sm svg{width:18px;height:18px}
.pct{display:block;font-size:20px;font-weight:700;margin-top:8px}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--n)}
.go{display:block;width:100%;margin:18px 0;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 17px Cairo,sans-serif;cursor:pointer}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.qbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:28px 16px;text-align:center;font-size:32px;font-weight:900;margin-bottom:16px}
.qbox.de{direction:ltr}
.box.ok{background:var(--n);border-color:var(--n);color:#fff}
.box.bad{background:var(--f);border-color:var(--f);color:#fff}
.chk{order:-1;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:20px;line-height:1;cursor:pointer;flex:none}
.chk[aria-pressed="true"]{background:var(--n);border-color:var(--n);color:#fff}
</style>
</head>

<header><h1 id="title">تعلّم الألماني</h1><button class="back" id="back" hidden>رجوع</button></header>

 const sh=a=>[...a].sort(()=>Math.random()-.5),art={m:"der",f:"die",n:"das"};
 const qs=sh(mode==="art"?learned.filter(w=>"mfn".includes(w.c)):learned).slice(0,10);let n=0,score=0;
 function show(){
  view.innerHTML="";
  if(!qs.length){view.innerHTML='<div class="empty">علّم بـ ✓ على أسماء (مذكر أو مؤنث أو محايد) الأول عشان تتدرب على الأدوات.</div>';view.append(btn("رجوع","go alt",()=>renderQuiz(l)));return}
  if(n>=qs.length){view.innerHTML=`<div class="empty"><h2>النتيجة: ${score} من ${qs.length}</h2></div>`;view.append(btn("إعادة التمرين","go",()=>runQuiz(l,mode,learned,pool)),btn("نوع تمرين تاني","go alt",()=>renderQuiz(l)));return}
  const w=qs[n],noun=w.de.replace(/^(der|die|das) /,"");
  const same=pool.filter(x=>x.c===w.c),P=same.length>=4?same:pool;
  let q,ans,all;
  if(mode==="ma"){q=w.de;ans=w.ar;all=P.map(x=>x.ar)}
  else if(mode==="art"){q=noun;ans=art[w.c];all=["der","die","das"]}
  else{q=w.ar;ans=w.de;all=P.map(x=>x.de)}
  const ch=mode==="art"?all:sh([ans,...sh([...new Set(all)].filter(o=>o!==ans)).slice(0,3)]);
  let done=0;
  view.innerHTML=`<p class="crumb">سؤال ${n+1} من ${qs.length}</p><div class="qbox ${mode==="am"?"":"de"}">${q}</div>`;
  const g=document.createElement("div");g.className="grid cats";
  ch.forEach(c=>{const b=btn(c,"box",()=>{if(done)return;done=1;
   if(c===ans){score++;b.classList.add("ok")}else{b.classList.add("bad");[...g.children].find(x=>x.textContent===ans).classList.add("ok")}
   view.append(btn(n+1<qs.length?"التالي":"شوف النتيجة","go",()=>{n++;show()}))});
   if(mode!=="ma")b.style.direction="ltr";g.append(b)});
  view.append(g)}
 show()}
const ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
/* m = رجل بالغ، f = شابة، n = طفل، وباقي الأقسام صوت عادي */
function speak(t,c){
 if(!("speechSynthesis" in window)){alert("المتصفح ده مش بيدعم النطق");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";
 const de=speechSynthesis.getVoices().filter(x=>x.lang.replace("_","-").startsWith("de"));
 const male=de.find(x=>/markus|stefan|hans|conrad|florian|jonas|martin|bernd|yannick|killian|\bmale\b/i.test(x.name));
 const fem=de.find(x=>/female|anna|petra|katja|marlene|vicki|hedda|amala|google|seraphina|helena/i.test(x.name));
 const P={m:[male?.8:.6,.85,male],f:[1.3,.9,fem],n:[1.9,1,fem]}[c]||[1,.9,fem||de[0]];
 u.pitch=P[0];u.rate=P[1];const v=P[2]||de[0];if(v)u.voice=v;
 speechSynthesis.speak(u)}
function btn(html,cls,fn){const b=document.createElement("button");b.className=cls;b.innerHTML=html;b.onclick=fn;return b}
function render(){
 view.innerHTML="";const[l,i,c]=st;
 back.hidden=!st.length;
 if(i==="quiz"){renderQuiz(l);return}
 if(!l){title.textContent="تعلّم الألماني";crumb.textContent="اختر مستواك";
  const g=document.createElement("div");g.className="grid levels";
  Object.keys(LESSONS).forEach(k=>g.append(btn(`<span class="lvl">${k}</span><small>${LEVEL_NAMES[k]}</small><span class="pct">${pct(k)}% محفوظ</span><span class="bar"><i style="width:${pct(k)}%"></i></span>`,"box",()=>go(k))));view.append(g)}
 else if(i==null){title.textContent="المستوى "+l;crumb.textContent="اختر الدرس";
  const g=document.createElement("div");g.className="grid lessons";
  view.append(btn("ابدأ التمرين · "+pct(l)+"% محفوظ","go",()=>go(l,"quiz")));LESSONS[l].forEach((n,j)=>g.append(btn(`<span class="num">درس ${j+1}</span>${n}`,"box",()=>go(l,j))));view.append(g)}
 else if(!c){title.textContent=LESSONS[l][i];crumb.textContent=l+" · اختر القسم";
  const g=document.createElement("div");g.className="grid cats";
  CATS.forEach(([k,n])=>g.append(btn(n,"box cat "+k,()=>go(l,i,k))));view.append(g)}
 else{const name=CATS.find(x=>x[0]===c)[1];title.textContent=name;crumb.textContent=l+" · "+LESSONS[l][i];
  const list=(WORDS[l+"-"+(i+1)]||{})[c]||[];
  if(!list.length){view.innerHTML='<div class="empty">الكلمات هتتضاف هنا قريبًا.</div>';return}
  const ul=document.createElement("ul");ul.className="words";
  list.forEach(([de,ar,ex,exAr])=>{if(!ex)[ex,exAr]=autoEx(c,de,ar);const li=document.createElement("li");li.className="w "+c;
   const row=btn(`<span class="de">${de}</span><span class="ar">${ar}</span>`,"row",()=>{const o=li.classList.toggle("open");row.setAttribute("aria-expanded",o)});
   row.setAttribute("aria-expanded","false");li.append(row);
   const id=wid(l,i,c,de),ck=btn("✓","chk",()=>{LR.has(id)?LR.delete(id):LR.add(id);saveLR();ck.setAttribute("aria-pressed",LR.has(id))});
   ck.setAttribute("aria-pressed",LR.has(id));ck.setAttribute("aria-label","حفظت "+de);ck.title="حفظتها";li.append(ck);
   const s=btn(ICON,"spk",()=>speak(de,c));s.setAttribute("aria-label","انطق "+de);li.append(s);
   const e=document.createElement("div");e.className="ex";
   if(ex){e.innerHTML=`<div class="exde">${ex}</div><div class="exar">${exAr||""}</div>`;const s2=btn(ICON,"spk sm",()=>speak(ex,c));s2.setAttribute("aria-label","انطق المثال");e.append(s2)}else e.textContent="المثال هيتضاف قريبًا.";
   li.append(e);ul.append(li)});
  view.append(ul)}
 window.scrollTo(0,0)}
function go(...a){st=a;render()}
back.onclick=()=>{st.pop();render()};
if("speechSynthesis" in window)speechSynthesis.getVoices();
render();
</script>
