<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch mit so3da</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#B2A0D6">
<script>
(function(){try{var saved=localStorage.getItem("de-theme");if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved)}catch(e){}})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5FB;--card:#FFFFFF;--ink:#302B3D;--mute:#706A7D;--line:#E7E0F0;--primary:#B2A0D6;--primary-dark:#70569B;
--m:#1d5fd1;--f:#d62839;--n:#1f9d55;--v:#111;--a:#7b3fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191720;--card:#24212D;--ink:#F4F0FA;--mute:#B5AEC4;--line:#3A3545;--m:#78A9FF;--f:#FF7887;--n:#53D69A;--v:#F4F0FA;--a:#C3A0FF}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#191720;--card:#24212D;--ink:#F4F0FA;--mute:#B5AEC4;--line:#3A3545;--m:#78A9FF;--f:#FF7887;--n:#53D69A;--v:#F4F0FA;--a:#C3A0FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Cairo,Tahoma,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px}
:focus-visible{outline:3px solid var(--primary-dark);outline-offset:3px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:900;flex:1}.brand-stack{flex:1;min-width:0}.brand-stack h1{direction:ltr;text-align:right}.brand-logo{display:inline-block;background:#050505;color:#fff;border-radius:7px;padding:3px 11px;font-size:clamp(17px,3.8vw,25px);line-height:1.45;letter-spacing:.2px;white-space:nowrap;box-shadow:0 2px 5px #0002}.brand-logo .logo-deutsch{color:#fff}.brand-logo .logo-mit{color:#dd2434}.brand-logo .logo-so3da{color:#ffce00}.brand-note{margin:5px 0 0;color:#4b267e;font-size:13px;font-weight:800;line-height:1.65;text-shadow:0 0.2px 0 currentColor}.brand-note[hidden]{display:none}.mobile-note-break{display:none}@media(max-width:600px){.mobile-note-break{display:block}}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 16px;font:700 15px Cairo,sans-serif;cursor:pointer}
.icon-nav{width:42px;height:42px;min-width:42px;padding:0;display:inline-grid;place-items:center;border-radius:12px;flex:none}
.icon-nav svg{width:23px;height:23px;display:block}
.icon-nav:hover{border-color:var(--m);color:var(--m)}
.icon-nav[hidden]{display:none}
.crumb{color:var(--mute);margin:0 0 22px;font-size:15px}
.grid{display:grid;gap:14px}
.levels{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lessons{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--ink);font:700 18px Cairo,sans-serif}
.box:hover{border-color:var(--primary-dark)}
.lvl{font-size:56px;font-weight:900;display:block;line-height:1.1}
.lvl+small{color:var(--mute);font-weight:500}
.num{display:block;color:var(--mute);font-size:14px;font-weight:500}
.cat{border-width:2px;border-color:currentColor}
.words{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.w{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
.w .de{direction:ltr;text-align:right;font-size:24px;font-weight:700}
.w .ar{color:var(--mute);font-size:16px}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:currentColor;cursor:pointer;display:grid;place-items:center;flex:none}
.spk svg{fill:var(--card);width:22px;height:22px}
.m{color:var(--m)}.f{color:var(--f)}.n{color:var(--n)}.v{color:var(--v)}.a{color:var(--a)}
.empty{color:var(--mute);background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.w{flex-wrap:wrap}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:0;flex:1;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-width:0}
.row .ar::after{content:" \25BE";font-size:13px}
.open .row .ar::after{content:" \25B4"}
.ex{display:none;flex-basis:100%;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--mute)}
.open .ex{display:grid}
.exde{direction:ltr;text-align:left;font-size:20px;font-weight:600;color:var(--ink)}
.exar{grid-column:1;color:var(--mute);font-size:15px}
.spk.sm{grid-row:1/3;grid-column:2;width:34px;height:34px}
.spk.sm svg{width:18px;height:18px}
.pct{display:block;font-size:20px;font-weight:700;margin-top:8px}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--n)}
.go{display:block;width:100%;margin:18px 0;padding:14px;border:0;border-radius:10px;background:var(--primary-dark);color:#FFFFFF;font:700 17px Cairo,sans-serif;cursor:pointer}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.qbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:28px 16px;text-align:center;font-size:32px;font-weight:900;margin-bottom:16px}
.qbox.de{direction:ltr}
.box.ok{background:var(--n);border-color:var(--n);color:#fff}
.box.bad{background:var(--f);border-color:var(--f);color:#fff}
.pin{display:block;width:100%;padding:14px;font:700 22px Cairo,sans-serif;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:left}
.fb{padding:12px;border-radius:10px;margin-top:10px;font-weight:700;text-align:center;direction:ltr}
.fb:empty{display:none}
.fb.ok{background:var(--n);color:#fff}
.fb.bad{background:var(--f);color:#fff}
.tile{display:flex;flex-direction:column;height:154px;min-height:154px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.t1{background:none;border:0;padding:16px 12px;color:var(--ink);font:700 18px Cairo,sans-serif;cursor:pointer;text-align:center}
.t1:hover{background:var(--bg)}
.t2{padding:8px 12px;border-top:1px solid var(--line);text-align:center}
.t3{border:0;border-top:1px solid var(--line);padding:10px;background:var(--primary-dark);color:#FFFFFF;font:700 15px Cairo,sans-serif;cursor:pointer}
/* بطاقات الدروس: عنوان علوي وشريطان سفليان */
.tile .t1{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;overflow-wrap:anywhere;line-height:1.35}
.tile .tile-bottom{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);height:48px;min-height:48px;flex:0 0 48px}
.tile .t2{display:flex;align-items:center;justify-content:center;gap:5px;border:0;padding:8px 5px;font-size:13px;min-width:0}
.tile .t3{border:0;border-right:1px solid var(--line);padding:8px 5px;font-size:14px;background:transparent;color:var(--ink);min-width:0}
.tile .t2{background:#F59E0B;color:#241500;border-radius:0}
.tile .t3{background:#7651A8;color:#fff;border-radius:0}
.tile .t3:hover{background:#5F3D90;color:#fff}
.tile .t2 b{color:#241500}

.tile-bottom>*{min-width:0}
@media(max-width:520px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{height:154px;min-height:154px}.tile .t1{font-size:15px;padding:8px 7px;min-height:0}.tile .t3{font-size:12px}.tile .t2{font-size:11px}}
.sec{margin:34px 0 12px;font-size:22px;font-weight:900}
.topic{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;text-align:start}
.topic .tt{direction:ltr;font-size:19px;font-weight:700}
.topic .lv{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 10px;font-size:14px}
.topic small{flex-basis:100%;color:var(--mute);font-weight:500;font-size:14px;line-height:1.5}
.pl{font-size:14px;color:var(--mute);font-weight:500}
.lvA1{background:#FFCE00;border-color:#FFCE00;color:#111}
.lvA2{background:#DD0000;border-color:#DD0000;color:#fff}
.lvB1{background:#000;border-color:#000;color:#fff}
@media (prefers-color-scheme:dark){.lvB1{border-color:#777}}
.lvA1 small,.lvA2 small,.lvB1 small{color:inherit;opacity:.85}
.lvA1 .bar{background:rgba(0,0,0,.22)}.lvA1 .bar i{background:#111}
.lvA2 .bar,.lvB1 .bar{background:rgba(255,255,255,.3)}.lvA2 .bar i,.lvB1 .bar i{background:#fff}
.lvA1 .lv{background:#111;color:#FFCE00}
.lvA2 .lv{background:#fff;color:#DD0000}
.lvB1 .lv{background:#fff;color:#000}
.lvA1:hover,.lvA2:hover,.lvB1:hover{filter:brightness(1.08)}
.para{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.prow{display:flex;gap:12px;align-items:flex-start}
.pde{flex:1;direction:ltr;text-align:left;font-size:20px;font-weight:600;margin:0 0 8px;line-height:1.7}
.par{margin:0;color:var(--mute);font-size:16px;line-height:1.8;border-top:1px dashed var(--line);padding-top:8px}
.welcome{min-height:72vh;display:grid;place-items:center}
.wbox{width:min(78vw,340px);aspect-ratio:1;border-radius:22px;border:3px solid #302B3D;background:#B2A0D6;color:#111111;font:900 clamp(28px,8vw,42px) Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;line-height:1.5;text-align:center;padding:16px;box-shadow:0 8px 22px rgba(112,86,155,.18);transition:transform .18s ease,background .18s ease}
.wbox:hover{background:#A18ACB;transform:translateY(-2px)}
.wbox small{font-size:14px;font-weight:700;color:#111111;opacity:.82}
.chk{order:-1;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:20px;line-height:1;cursor:pointer;flex:none}
.chk[aria-pressed="true"]{background:var(--n);border-color:var(--n);color:#fff}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rank-card{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px;margin:12px 0 18px}
.rank-name{font-size:28px;font-weight:900;margin:0}
.xp-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.dash-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px;text-align:center}
.stat strong{display:block;font-size:28px;line-height:1.3}
.stat span{color:var(--mute);font-size:14px}
.dash-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dash-list li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.progress-row{display:grid;grid-template-columns:85px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.progress-row .bar{margin:0}

.challenge-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 16px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.challenge-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;text-align:center}
.challenge-stat strong{font-size:25px;line-height:1.15;font-weight:900}
.challenge-stat span{font-size:13px;color:var(--mute);font-weight:700}
@media(max-width:480px){.challenge-stats{gap:4px;padding:10px 5px}.challenge-stat strong{font-size:22px}.challenge-stat span{font-size:11px}}
.social-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.social-card h2,.social-card h3{margin:0 0 8px;font-size:20px}
.social-muted{color:var(--mute);font-size:14px;margin:4px 0 10px}
.social-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.social-actions button{flex:1 1 130px}
.social-input,.social-select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 16px Cairo,sans-serif;margin:5px 0 10px}
.social-person{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;min-width:0}
.social-card{padding:12px;margin:10px 0}
.social-card h2,.social-card h3{font-size:18px;margin-bottom:6px}
.social-avatar{width:32px;height:32px}
.social-person-main{flex:1 1 0;min-width:0}
.social-person-main strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.social-person-main small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.social-person .back,.social-person button{font-size:12px;padding:7px 9px;line-height:1.35;flex:0 1 auto;min-width:0}
.friend-history{flex-basis:100%;background:var(--bg);border-radius:8px;padding:8px;margin-top:5px;font-size:13px}
.friend-history .social-person{background:var(--card)}
/* Friend cards: avatar + visible name + challenge + history, in one compact row */
.social-person.friend-row{display:grid;grid-template-columns:42px minmax(110px,1fr) auto auto;direction:rtl;align-items:center;gap:10px;padding:9px 11px}
.friend-row .social-avatar{width:40px;height:40px}
.friend-row .social-person-main{min-width:0;flex:initial;direction:rtl;text-align:right}
.friend-row .social-person-main strong{display:block;font-size:14px;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.friend-row .social-person-main small{display:block;font-size:11px;white-space:normal;overflow-wrap:anywhere}
.friend-row button{white-space:nowrap;min-width:max-content;font-size:12px;padding:7px 10px}
.friend-row .friend-history{grid-column:1/-1;width:100%;min-width:0}
.challenge-friend-row{grid-template-columns:42px minmax(90px,1fr) auto auto!important}
.friend-challenge-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:8px;border-top:1px solid var(--line);text-align:center}
.friend-challenge-stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.friend-challenge-stat strong{font-size:22px;line-height:1.2;font-weight:900}
.friend-challenge-stat span{font-size:11px;color:var(--mute);font-weight:700}
.history-challenge-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.history-challenge-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.history-challenge-info strong{font-size:12px;overflow-wrap:anywhere}
.history-challenge-info small{font-size:11px;color:var(--mute)}
.history-scores{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
@media(max-width:520px){.social-person.friend-row{grid-template-columns:34px minmax(60px,1fr) auto auto;gap:5px;padding:7px}.challenge-friend-row{grid-template-columns:34px minmax(60px,1fr) auto auto!important}.friend-challenge-stats{gap:3px;padding-top:6px}.friend-challenge-stat strong{font-size:19px}.friend-challenge-stat span{font-size:10px}.history-scores{gap:8px;font-size:11px}.friend-row .social-avatar{display:grid;width:32px;height:32px}.friend-row button{font-size:10px;padding:6px 5px;min-width:0}.friend-row .social-person-main strong{font-size:12px}.friend-row .social-person-main small{font-size:10px}}
.social-person:last-child{border-bottom:0}
.social-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;flex:none}
.google-profile-photo{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line,#555);background:var(--card,#222);display:grid;place-items:center;overflow:hidden;font-size:26px} .google-profile-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.social-person-main{flex:1;min-width:0;overflow-wrap:anywhere}
.social-person-main strong{display:block}
.social-person-main small{color:var(--mute)}
.friend-rank-line{display:block;font-size:12px!important;margin-top:4px;color:var(--text)!important}
.friend-rank-progress{display:flex;align-items:center;gap:7px;margin-top:5px;min-width:0}
.friend-rank-bar{display:block;flex:1;min-width:35px;height:5px;border-radius:99px;background:var(--line,#777);overflow:hidden}
.friend-rank-bar i{display:block;height:100%;border-radius:99px;background:#9B7AE8}
.friend-rank-next{font-size:10px!important;white-space:nowrap}
.challenge-timer{font-size:22px;font-weight:900;text-align:center;margin:8px 0}
.challenge-choice{direction:auto;text-align:center;overflow-wrap:anywhere}
.challenge-result{font-size:22px;font-weight:900;text-align:center;padding:16px}

/* تحسين ترتيب الهيدر على شاشات الهاتف */
@media (max-width:520px){
  /* بطاقات مستويات A1/A2/B1/B2 في الهاتف: بطاقتان في كل صف */
  .levels{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .levels>.box{min-width:0;padding:14px 8px;border-radius:12px;overflow-wrap:anywhere}
  .levels>.box .lvl{font-size:clamp(30px,9vw,44px);line-height:1.12}
  .levels>.box small{font-size:12px;line-height:1.5}
  .levels>.box .pct{font-size:14px}
  .levels>.box .bar{height:6px}
  #hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;position:relative}
  #hdr .brand-stack{order:0;flex:0 0 100%;width:100%;text-align:center;min-width:0}
  #hdr .brand-stack h1{text-align:center;line-height:1.35}
  /* داخل الصفحات: العنوان ناحية اليمين وزر الرجوع أقصى الشمال */
  #hdr.page-view{justify-content:space-between;flex-wrap:nowrap}
  #hdr.page-view .brand-stack{order:0;flex:1 1 auto;width:auto;text-align:right;min-width:0}
  #hdr.page-view .brand-stack h1{text-align:right;font-size:clamp(21px,5.5vw,30px)}
  #hdr.page-view #back{order:2;flex:0 0 auto;margin:0 0 0 auto;white-space:nowrap}
  #hdr.page-view #auth:not([hidden]){order:1;flex:0 0 100%;width:100%}
  #hdr .brand-logo{max-width:100%;white-space:normal;overflow-wrap:anywhere;display:inline-block;padding:4px 10px}
  #hdr .brand-note{max-width:100%;width:100%;margin:7px auto 0;padding:0 5px;font-size:12px;line-height:1.8;white-space:normal;overflow-wrap:anywhere;word-break:normal;text-align:center}
  /* Put Google sign-in on its own full-width row, with the two icon buttons below it */
  #hdr #auth:not([hidden]){order:1;flex:0 0 100%;width:100%;max-width:100%;white-space:normal;text-align:center;line-height:1.5;margin:0 auto}
  #hdr #back{order:1}
  /* On phones, put each icon on its own line below the Google button */
  #hdr #dashboard,#hdr #social{order:2;flex:0 0 100%;width:42px;min-width:42px;height:42px;margin:2px auto 0;justify-self:center}
  #hdr #dashboard:not([hidden]),#hdr #social:not([hidden]){display:inline-grid;margin-right:auto;margin-left:auto}
}


/* Lavender accents: highlight navigation, profile and friends without changing vocabulary/category colors */
#hdr .icon-nav{border-color:#D8C9EE;background:#F0EAF9;color:#70569B;transition:background .18s ease,border-color .18s ease,transform .18s ease}
#hdr .icon-nav:hover,#hdr .icon-nav:focus-visible{border-color:#70569B;background:#E5DAF5;color:#5D438A}
#hdr .icon-nav:active{transform:translateY(1px)}
#hdr .icon-nav svg{stroke:currentColor}
.google-profile-photo{border:3px solid #B2A0D6;box-shadow:0 0 0 3px #F0EAF9}
.social-card{border-color:#E3D9F1;box-shadow:0 3px 12px rgba(112,86,155,.045)}

/* restrained white + lavender app styling; preserve original level and word-type colors */
:root{--primary:#8b6bc1;--primary-dark:#62458f;--bg:#fdfcff;--card:#ffffff;--line:#e9e3f2}
body{background:var(--bg)}
.box{border-radius:14px;box-shadow:0 2px 9px rgba(79,55,119,.045);transition:border-color .18s,box-shadow .18s,transform .18s}
.box:hover{border-color:var(--primary);box-shadow:0 5px 15px rgba(79,55,119,.09)}
.go,.t3{background:var(--primary-dark)}
.back:focus-visible,.box:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* These shortcuts are duplicated in the bottom navigation */
#dashboard,#social{display:none!important}
body{padding-bottom:82px}
#app-bottom-nav{position:fixed;z-index:9999;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-top:1px solid #e9e3f2;box-shadow:0 -4px 18px rgba(79,55,119,.06)}
#app-bottom-nav button{border:0;background:transparent;color:#777080;border-radius:12px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 11px/1.4 Cairo,Tahoma,sans-serif;cursor:pointer;padding:4px 2px}
#app-bottom-nav .nav-ico{font-size:20px;line-height:1.2;display:flex;align-items:center;justify-content:center}#app-bottom-nav .nav-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app-bottom-nav button[aria-current=page]{background:#f1ecf9;color:#62458f}
@media(min-width:800px){#app-bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(540px,calc(100% - 32px));border:1px solid #e9e3f2;border-bottom:0;border-radius:16px 16px 0 0}}


/* شريط البحث: الاسم 75% وزر البحث 25% على الشمال */
.friend-search-bar{display:flex;direction:rtl;align-items:stretch;gap:8px;width:100%;margin:4px 0 8px}
.friend-search-bar .social-input{flex:3 1 0;width:0;min-width:0;margin:0}
.friend-search-bar .go{flex:1 1 0;min-width:0;margin:0;padding:10px 6px;white-space:nowrap}
@media(max-width:380px){.friend-search-bar{gap:5px}.friend-search-bar .go{font-size:13px}}
/* صورة الحساب داخل مربع الرتبة وإعداد تغيير الاسم */
.rank-card{position:relative}
.rank-card-top{display:flex;direction:ltr;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.rank-card-top-copy{direction:rtl;flex:1;min-width:0}
.rank-card-avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;object-fit:cover;border:3px solid #B2A0D6;background:var(--card,#222);box-shadow:0 0 0 3px rgba(240,234,249,.25);display:grid;place-items:center;overflow:hidden;font-size:27px;line-height:1}.rank-card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.settings-name-row{display:grid;gap:8px}
.settings-name-row label{font-weight:700}
.settings-name-row input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.settings-name-row button{border:0;border-radius:10px;padding:11px 14px;background:var(--primary-dark);color:#fff;font:700 14px Cairo,Tahoma,sans-serif;cursor:pointer}
/* صفحة الإعدادات */
.settings-card{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;display:grid;gap:12px}
.settings-card h2{font-size:18px;margin:0}.settings-card p{font-size:14px;color:var(--mute);margin:0}
#settings-auth-slot #auth{display:block;width:100%;margin:0;padding:12px;border:0;border-radius:11px;background:var(--primary-dark);color:#fff;font:700 15px Cairo,Tahoma,sans-serif;white-space:normal}
#settings-auth-slot #auth[hidden]{display:none}
.settings-nav-icon{font-size:21px;line-height:1}
/* إعدادات المظهر داخل الملف الشخصي */
.theme-setting{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px;padding:15px 16px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 9px rgba(79,55,119,.045)}
.theme-setting-copy{display:grid;gap:2px}.theme-setting-copy strong{font-size:16px}.theme-setting-copy span{font-size:13px;color:var(--mute)}
.theme-toggle{border:0;border-radius:11px;padding:10px 15px;background:var(--primary-dark);color:#fff;font:700 14px Cairo,Tahoma,sans-serif;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
:root[data-theme="dark"] #app-bottom-nav{background:rgba(15,13,21,.98);border-color:var(--line);box-shadow:0 -4px 22px rgba(0,0,0,.42)}
:root[data-theme="dark"] #app-bottom-nav button{color:#d0c4bc}
:root[data-theme="dark"] #app-bottom-nav button[aria-current=page]{background:#292136;color:#E2D2FF}
:root[data-theme="dark"] .social-card,:root[data-theme="dark"] .social-person{background:var(--card);border-color:var(--line);color:var(--ink)}
:root[data-theme="dark"] .social-card .go.alt,:root[data-theme="dark"] .social-person .go.alt{background:#211B2D;color:#E2D4FF;border-color:#49405B}
:root[data-theme="dark"] .social-avatar:not(img){background:#211B2D;color:#E2D4FF;border-color:#49405B}
 :root[data-theme="dark"] .brand-note{color:#D7C2FF}
:root[data-theme="dark"] #hdr .icon-nav{border-color:#393047;background:#211B2D;color:#D7C2FF}
:root[data-theme="dark"] #hdr .icon-nav:hover,:root[data-theme="dark"] #hdr .icon-nav:focus-visible{border-color:#8B6BC1;background:#302541;color:#F0E7FF}
:root[data-theme="dark"] .google-profile-photo{border-color:#8B6BC1;box-shadow:0 0 0 3px #211B2D}
:root[data-theme="dark"] .social-card{border-color:var(--line);box-shadow:0 3px 12px rgba(0,0,0,.2)}
:root[data-theme="dark"] .social-person{border-color:var(--line)}
:root[data-theme="dark"] .friend-row .social-avatar{border-color:#49405B}
:root[data-theme="dark"] .social-card .go.alt:hover,:root[data-theme="dark"] .social-person .go.alt:hover{border-color:#8B6BC1;background:#302541}
:root[data-theme="dark"] .social-input,:root[data-theme="dark"] .social-select{background:#100E16;color:var(--ink);border-color:var(--line)}
:root[data-theme="dark"] .theme-setting{box-shadow:0 2px 12px rgba(0,0,0,.22)}

.proverb-section{margin-top:30px}

:root[data-theme="dark"] .proverb-card-bottom,:root[data-theme="dark"] .proverb-card-exam{border-color:#49405B}
:root[data-theme="dark"] .proverb-quiz-option.correct{background:#163b25;color:#9df0b2}

.proverb-icon{font-size:28px;line-height:1.2}

/* Notifications center */
