<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch mit so3da</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#B2A0D6">
<script>
(function(){try{var saved=localStorage.getItem("de-theme");if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved)}catch(e){}})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5FB;--card:#FFFFFF;--ink:#302B3D;--mute:#706A7D;--line:#E7E0F0;--primary:#B2A0D6;--primary-dark:#70569B;
--m:#1d5fd1;--f:#d62839;--n:#1f9d55;--v:#111;--a:#7b3fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191720;--card:#24212D;--ink:#F4F0FA;--mute:#B5AEC4;--line:#3A3545;--m:#78A9FF;--f:#FF7887;--n:#53D69A;--v:#F4F0FA;--a:#C3A0FF}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#191720;--card:#24212D;--ink:#F4F0FA;--mute:#B5AEC4;--line:#3A3545;--m:#78A9FF;--f:#FF7887;--n:#53D69A;--v:#F4F0FA;--a:#C3A0FF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Cairo,Tahoma,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px}
:focus-visible{outline:3px solid var(--primary-dark);outline-offset:3px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:900;flex:1}.brand-stack{flex:1;min-width:0}.brand-stack h1{direction:ltr;text-align:right}.brand-logo{display:inline-block;background:#050505;color:#fff;border-radius:7px;padding:3px 11px;font-size:clamp(17px,3.8vw,25px);line-height:1.45;letter-spacing:.2px;white-space:nowrap;box-shadow:0 2px 5px #0002}.brand-logo .logo-deutsch{color:#fff}.brand-logo .logo-mit{color:#dd2434}.brand-logo .logo-so3da{color:#ffce00}.brand-note{margin:5px 0 0;color:#4b267e;font-size:13px;font-weight:800;line-height:1.65;text-shadow:0 0.2px 0 currentColor}.brand-note[hidden]{display:none}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 16px;font:700 15px Cairo,sans-serif;cursor:pointer}
.icon-nav{width:42px;height:42px;min-width:42px;padding:0;display:inline-grid;place-items:center;border-radius:12px;flex:none}
.icon-nav svg{width:23px;height:23px;display:block}
.icon-nav:hover{border-color:var(--m);color:var(--m)}
.icon-nav[hidden]{display:none}
.crumb{color:var(--mute);margin:0 0 22px;font-size:15px}
.grid{display:grid;gap:14px}
.levels{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lessons{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--ink);font:700 18px Cairo,sans-serif}
.box:hover{border-color:var(--primary-dark)}
.lvl{font-size:56px;font-weight:900;display:block;line-height:1.1}
.lvl+small{color:var(--mute);font-weight:500}
.num{display:block;color:var(--mute);font-size:14px;font-weight:500}
.cat{border-width:2px;border-color:currentColor}
.words{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.w{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
.w .de{direction:ltr;text-align:right;font-size:24px;font-weight:700}
.w .ar{color:var(--mute);font-size:16px}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:currentColor;cursor:pointer;display:grid;place-items:center;flex:none}
.spk svg{fill:var(--card);width:22px;height:22px}
.m{color:var(--m)}.f{color:var(--f)}.n{color:var(--n)}.v{color:var(--v)}.a{color:var(--a)}
.empty{color:var(--mute);background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.w{flex-wrap:wrap}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:0;flex:1;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-width:0}
.row .ar::after{content:" \25BE";font-size:13px}
.open .row .ar::after{content:" \25B4"}
.ex{display:none;flex-basis:100%;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--mute)}
.open .ex{display:grid}
.exde{direction:ltr;text-align:left;font-size:20px;font-weight:600;color:var(--ink)}
.exar{grid-column:1;color:var(--mute);font-size:15px}
.spk.sm{grid-row:1/3;grid-column:2;width:34px;height:34px}
.spk.sm svg{width:18px;height:18px}
.pct{display:block;font-size:20px;font-weight:700;margin-top:8px}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--n)}
.go{display:block;width:100%;margin:18px 0;padding:14px;border:0;border-radius:10px;background:var(--primary-dark);color:#FFFFFF;font:700 17px Cairo,sans-serif;cursor:pointer}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.qbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:28px 16px;text-align:center;font-size:32px;font-weight:900;margin-bottom:16px}
.qbox.de{direction:ltr}
.box.ok{background:var(--n);border-color:var(--n);color:#fff}
.box.bad{background:var(--f);border-color:var(--f);color:#fff}
.pin{display:block;width:100%;padding:14px;font:700 22px Cairo,sans-serif;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:left}
.fb{padding:12px;border-radius:10px;margin-top:10px;font-weight:700;text-align:center;direction:ltr}
.fb:empty{display:none}
.fb.ok{background:var(--n);color:#fff}
.fb.bad{background:var(--f);color:#fff}
.tile{display:flex;flex-direction:column;height:154px;min-height:154px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.t1{background:none;border:0;padding:16px 12px;color:var(--ink);font:700 18px Cairo,sans-serif;cursor:pointer;text-align:center}
.t1:hover{background:var(--bg)}
.t2{padding:8px 12px;border-top:1px solid var(--line);text-align:center}
.t3{border:0;border-top:1px solid var(--line);padding:10px;background:var(--primary-dark);color:#FFFFFF;font:700 15px Cairo,sans-serif;cursor:pointer}
/* بطاقات الدروس: عنوان علوي وشريطان سفليان */
.tile .t1{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;overflow-wrap:anywhere;line-height:1.35}
.tile .tile-bottom{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);height:48px;min-height:48px;flex:0 0 48px}
.tile .t2{display:flex;align-items:center;justify-content:center;gap:5px;border:0;padding:8px 5px;font-size:13px;min-width:0}
.tile .t3{border:0;border-right:1px solid var(--line);padding:8px 5px;font-size:14px;background:transparent;color:var(--ink);min-width:0}
.tile .t2{background:#F59E0B;color:#241500;border-radius:0}
.tile .t3{background:#7651A8;color:#fff;border-radius:0}
.tile .t3:hover{background:#5F3D90;color:#fff}
.tile .t2 b{color:#241500}

.tile-bottom>*{min-width:0}
@media(max-width:520px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{height:154px;min-height:154px}.tile .t1{font-size:15px;padding:8px 7px;min-height:0}.tile .t3{font-size:12px}.tile .t2{font-size:11px}}
.sec{margin:34px 0 12px;font-size:22px;font-weight:900}
.topic{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;text-align:start}
.topic .tt{direction:ltr;font-size:19px;font-weight:700}
.topic .lv{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 10px;font-size:14px}
.topic small{flex-basis:100%;color:var(--mute);font-weight:500;font-size:14px;line-height:1.5}
.pl{font-size:14px;color:var(--mute);font-weight:500}
.lvA1{background:#FFCE00;border-color:#FFCE00;color:#111}
.lvA2{background:#DD0000;border-color:#DD0000;color:#fff}
.lvB1{background:#000;border-color:#000;color:#fff}
@media (prefers-color-scheme:dark){.lvB1{border-color:#777}}
.lvA1 small,.lvA2 small,.lvB1 small{color:inherit;opacity:.85}
.lvA1 .bar{background:rgba(0,0,0,.22)}.lvA1 .bar i{background:#111}
.lvA2 .bar,.lvB1 .bar{background:rgba(255,255,255,.3)}.lvA2 .bar i,.lvB1 .bar i{background:#fff}
.lvA1 .lv{background:#111;color:#FFCE00}
.lvA2 .lv{background:#fff;color:#DD0000}
.lvB1 .lv{background:#fff;color:#000}
.lvA1:hover,.lvA2:hover,.lvB1:hover{filter:brightness(1.08)}
.para{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.prow{display:flex;gap:12px;align-items:flex-start}
.pde{flex:1;direction:ltr;text-align:left;font-size:20px;font-weight:600;margin:0 0 8px;line-height:1.7}
.par{margin:0;color:var(--mute);font-size:16px;line-height:1.8;border-top:1px dashed var(--line);padding-top:8px}
.welcome{min-height:72vh;display:grid;place-items:center}
.wbox{width:min(78vw,340px);aspect-ratio:1;border-radius:22px;border:3px solid #302B3D;background:#B2A0D6;color:#111111;font:900 clamp(28px,8vw,42px) Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;line-height:1.5;text-align:center;padding:16px;box-shadow:0 8px 22px rgba(112,86,155,.18);transition:transform .18s ease,background .18s ease}
.wbox:hover{background:#A18ACB;transform:translateY(-2px)}
.wbox small{font-size:14px;font-weight:700;color:#111111;opacity:.82}
.chk{order:-1;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:20px;line-height:1;cursor:pointer;flex:none}
.chk[aria-pressed="true"]{background:var(--n);border-color:var(--n);color:#fff}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rank-card{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px;margin:12px 0 18px}
.rank-name{font-size:28px;font-weight:900;margin:0}
.xp-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.dash-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px;text-align:center}
.stat strong{display:block;font-size:28px;line-height:1.3}
.stat span{color:var(--mute);font-size:14px}
.dash-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dash-list li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.progress-row{display:grid;grid-template-columns:85px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.progress-row .bar{margin:0}

.challenge-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 16px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.challenge-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;text-align:center}
.challenge-stat strong{font-size:25px;line-height:1.15;font-weight:900}
.challenge-stat span{font-size:13px;color:var(--mute);font-weight:700}
@media(max-width:480px){.challenge-stats{gap:4px;padding:10px 5px}.challenge-stat strong{font-size:22px}.challenge-stat span{font-size:11px}}
.social-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.social-card h2,.social-card h3{margin:0 0 8px;font-size:20px}
.social-muted{color:var(--mute);font-size:14px;margin:4px 0 10px}
.social-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.social-actions button{flex:1 1 130px}
.social-input,.social-select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 16px Cairo,sans-serif;margin:5px 0 10px}
.social-person{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;min-width:0}
.social-card{padding:12px;margin:10px 0}
.social-card h2,.social-card h3{font-size:18px;margin-bottom:6px}
.social-avatar{width:32px;height:32px}
.social-person-main{flex:1 1 0;min-width:0}
.social-person-main strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.social-person-main small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.social-person .back,.social-person button{font-size:12px;padding:7px 9px;line-height:1.35;flex:0 1 auto;min-width:0}
.friend-history{flex-basis:100%;background:var(--bg);border-radius:8px;padding:8px;margin-top:5px;font-size:13px}
.friend-history .social-person{background:var(--card)}
/* Friend cards: avatar + visible name + challenge + history, in one compact row */
.social-person.friend-row{display:grid;grid-template-columns:42px minmax(110px,1fr) auto auto;direction:rtl;align-items:center;gap:10px;padding:9px 11px}
.friend-row .social-avatar{width:40px;height:40px}
.friend-row .social-person-main{min-width:0;flex:initial;direction:rtl;text-align:right}
.friend-row .social-person-main strong{display:block;font-size:14px;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.friend-row .social-person-main small{display:block;font-size:11px;white-space:normal;overflow-wrap:anywhere}
.friend-row button{white-space:nowrap;min-width:max-content;font-size:12px;padding:7px 10px}
.friend-row .friend-history{grid-column:1/-1;width:100%;min-width:0}
.challenge-friend-row{grid-template-columns:42px minmax(90px,1fr) auto auto!important}
.friend-challenge-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:8px;border-top:1px solid var(--line);text-align:center}
.friend-challenge-stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.friend-challenge-stat strong{font-size:22px;line-height:1.2;font-weight:900}
.friend-challenge-stat span{font-size:11px;color:var(--mute);font-weight:700}
.history-challenge-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.history-challenge-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.history-challenge-info strong{font-size:12px;overflow-wrap:anywhere}
.history-challenge-info small{font-size:11px;color:var(--mute)}
.history-scores{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
@media(max-width:520px){.social-person.friend-row{grid-template-columns:34px minmax(60px,1fr) auto auto;gap:5px;padding:7px}.challenge-friend-row{grid-template-columns:34px minmax(60px,1fr) auto auto!important}.friend-challenge-stats{gap:3px;padding-top:6px}.friend-challenge-stat strong{font-size:19px}.friend-challenge-stat span{font-size:10px}.history-scores{gap:8px;font-size:11px}.friend-row .social-avatar{display:grid;width:32px;height:32px}.friend-row button{font-size:10px;padding:6px 5px;min-width:0}.friend-row .social-person-main strong{font-size:12px}.friend-row .social-person-main small{font-size:10px}}
.social-person:last-child{border-bottom:0}
.social-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;flex:none}
.google-profile-photo{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line,#555);background:var(--card,#222);display:grid;place-items:center;overflow:hidden;font-size:26px} .google-profile-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.social-person-main{flex:1;min-width:0;overflow-wrap:anywhere}
.social-person-main strong{display:block}
.social-person-main small{color:var(--mute)}
.friend-rank-line{display:block;font-size:12px!important;margin-top:4px;color:var(--text)!important}
.friend-rank-progress{display:flex;align-items:center;gap:7px;margin-top:5px;min-width:0}
.friend-rank-bar{display:block;flex:1;min-width:35px;height:5px;border-radius:99px;background:var(--line,#777);overflow:hidden}
.friend-rank-bar i{display:block;height:100%;border-radius:99px;background:#9B7AE8}
.friend-rank-next{font-size:10px!important;white-space:nowrap}
.challenge-timer{font-size:22px;font-weight:900;text-align:center;margin:8px 0}
.challenge-choice{direction:auto;text-align:center;overflow-wrap:anywhere}
.challenge-result{font-size:22px;font-weight:900;text-align:center;padding:16px}

/* تحسين ترتيب الهيدر على شاشات الهاتف */
@media (max-width:520px){
  /* بطاقات مستويات A1/A2/B1/B2 في الهاتف: بطاقتان في كل صف */
  .levels{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .levels>.box{min-width:0;padding:14px 8px;border-radius:12px;overflow-wrap:anywhere}
  .levels>.box .lvl{font-size:clamp(30px,9vw,44px);line-height:1.12}
  .levels>.box small{font-size:12px;line-height:1.5}
  .levels>.box .pct{font-size:14px}
  .levels>.box .bar{height:6px}
  #hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;position:relative}
  #hdr .brand-stack{order:0;flex:0 0 100%;width:100%;text-align:center;min-width:0}
  #hdr .brand-stack h1{text-align:center;line-height:1.35}
  /* داخل الصفحات: العنوان ناحية اليمين وزر الرجوع أقصى الشمال */
  #hdr.page-view{justify-content:space-between;flex-wrap:nowrap}
  #hdr.page-view .brand-stack{order:0;flex:1 1 auto;width:auto;text-align:right;min-width:0}
  #hdr.page-view .brand-stack h1{text-align:right;font-size:clamp(21px,5.5vw,30px)}
  #hdr.page-view #back{order:2;flex:0 0 auto;margin:0 0 0 auto;white-space:nowrap}
  #hdr.page-view #auth:not([hidden]){order:1;flex:0 0 100%;width:100%}
  #hdr .brand-logo{max-width:100%;white-space:normal;overflow-wrap:anywhere;display:inline-block;padding:4px 10px}
  #hdr .brand-note{max-width:100%;width:100%;margin:7px auto 0;padding:0 5px;font-size:12px;line-height:1.8;white-space:normal;overflow-wrap:anywhere;word-break:normal;text-align:center}
  /* Put Google sign-in on its own full-width row, with the two icon buttons below it */
  #hdr #auth:not([hidden]){order:1;flex:0 0 100%;width:100%;max-width:100%;white-space:normal;text-align:center;line-height:1.5;margin:0 auto}
  #hdr #back{order:1}
  /* On phones, put each icon on its own line below the Google button */
  #hdr #dashboard,#hdr #social{order:2;flex:0 0 100%;width:42px;min-width:42px;height:42px;margin:2px auto 0;justify-self:center}
  #hdr #dashboard:not([hidden]),#hdr #social:not([hidden]){display:inline-grid;margin-right:auto;margin-left:auto}
}


/* Lavender accents: highlight navigation, profile and friends without changing vocabulary/category colors */
#hdr .icon-nav{border-color:#D8C9EE;background:#F0EAF9;color:#70569B;transition:background .18s ease,border-color .18s ease,transform .18s ease}
#hdr .icon-nav:hover,#hdr .icon-nav:focus-visible{border-color:#70569B;background:#E5DAF5;color:#5D438A}
#hdr .icon-nav:active{transform:translateY(1px)}
#hdr .icon-nav svg{stroke:currentColor}
.google-profile-photo{border:3px solid #B2A0D6;box-shadow:0 0 0 3px #F0EAF9}
.social-card{border-color:#E3D9F1;box-shadow:0 3px 12px rgba(112,86,155,.045)}
.social-card h2,.social-card h3{border-right:3px solid #B2A0D6;padding-right:9px}
.social-person{border-color:#E7E0F0}

["Ich stehe jeden Tag um sieben Uhr auf. Dann gehe ich ins Badezimmer und wasche mein Gesicht. Danach putze ich meine Zähne und ziehe mich an.","أستيقظ كل يوم في الساعة السابعة. ثم أذهب إلى الحمّام وأغسل وجهي. بعد ذلك أنظّف أسناني وأرتدي ملابسي."],
["Um halb acht frühstücke ich. Ich esse Brot und Käse und trinke Tee. Um acht Uhr gehe ich zur Universität. Ich fahre mit dem Bus.","في السابعة والنصف أتناول الفطور. آكل خبزاً وجبناً وأشرب شاياً. في الثامنة أذهب إلى الجامعة. أذهب بالحافلة."],
["An der Universität lerne ich Deutsch und treffe meine Freunde. Wir sprechen zusammen und machen unsere Aufgaben. Um zwei Uhr fahre ich nach Hause.","في الجامعة أتعلّم الألمانية وألتقي بأصدقائي. نتحدث معاً ونقوم بمهامنا. في الساعة الثانية أعود إلى البيت."],
["Zu Hause esse ich mit meiner Familie zu Mittag. Am Nachmittag lerne ich Deutsch und mache meine Hausaufgaben.","في البيت أتناول الغداء مع عائلتي. بعد الظهر أتعلّم الألمانية وأقوم بواجباتي المنزلية."],
["Am Abend sehe ich fern oder höre Musik. Manchmal spiele ich Fußball oder gehe mit meinen Freunden spazieren.","في المساء أشاهد التلفاز أو أستمع إلى الموسيقى. أحياناً ألعب كرة القدم أو أتنزّه مع أصدقائي."],

TX("Essen und Trinken",[["Ich möchte über mein Essen und meine Getränke sprechen.","أريد أن أتحدث عن طعامي ومشروباتي."],
["Zum Frühstück esse ich gern Brot, Käse und Eier. Ich trinke meistens Tee mit Milch. Zum Mittagessen esse ich gern Reis mit Fleisch oder Hähnchen. Manchmal esse ich auch Nudeln. Ich trinke Wasser oder Orangensaft.","على الفطور أحب أن آكل خبزاً وجبناً وبيضاً. أشرب غالباً شاياً بالحليب. على الغداء أحب أن آكل أرزاً مع لحم أو دجاج. أحياناً آكل مكرونة أيضاً. أشرب ماءً أو عصير برتقال."],
["Am Abend esse ich gern Sandwiches mit Käse oder einen Hamburger. Mein Lieblingsessen ist Pizza, denn sie schmeckt sehr gut. Zwischen den Mahlzeiten esse ich gern Obst, besonders Äpfel und Bananen. Manchmal esse ich auch Schokolade oder Kekse.","في المساء أحب أن آكل ساندويتشات بالجبن أو همبرغر. طعامي المفضل هو البيتزا لأن طعمها لذيذ جداً. بين الوجبات أحب أن آكل الفاكهة، خصوصاً التفاح والموز. أحياناً آكل الشوكولاتة أو البسكويت أيضاً."],
["Mein Lieblingsgetränk ist Orangensaft, aber ich trinke auch gern Wasser, Tee und Milch. Cola trinke ich manchmal, aber nicht jeden Tag. Am Wochenende esse ich manchmal mit meiner Familie im Restaurant. Wir essen zusammen und trinken Saft. Ich esse gern mit meiner Familie, denn das macht Spaß.","مشروبي المفضل هو عصير البرتقال، لكنني أحب أيضاً شرب الماء والشاي والحليب. أشرب الكولا أحياناً لكن ليس كل يوم. في عطلة نهاية الأسبوع آكل أحياناً مع عائلتي في مطعم. نأكل معاً ونشرب عصيراً. أحب الأكل مع عائلتي لأن ذلك ممتع."]]);
TX("Den eigenen Beruf, den Arbeitsplatz",[["Ich arbeite in einer Firma und meine Arbeit ist interessant.","أعمل في شركة وعملي مثير للاهتمام."],
["Mein Chef ist nett und freundlich, aber er ist manchmal streng. Meine Kollegen sind auch nett und wir helfen uns.","مديري لطيف وودود لكنه أحياناً صارم. زملائي أيضاً لطفاء ونساعد بعضنا."],
["Ich spreche jeden Tag mit vielen Kunden und ich helfe ihnen gern. Die Kunden sind meistens freundlich, aber manchmal sind sie nicht zufrieden.","أتحدث كل يوم مع عملاء كثيرين وأحب مساعدتهم. العملاء ودودون في الغالب لكنهم أحياناً لا يكونون راضين."],
["Für mich ist Freundlichkeit sehr wichtig und ich möchte gute Kollegen haben. Geld ist auch wichtig, aber es ist nicht alles. Ich möchte genug Freizeit haben und meine Arbeit gern machen.","بالنسبة لي اللطف مهم جداً وأريد أن يكون لدي زملاء جيدون. المال مهم أيضاً لكنه ليس كل شيء. أريد أن يكون لدي وقت فراغ كافٍ وأن أحب عملي."],
["Ich mag Stress nicht, denn ich möchte ruhig arbeiten. Ich arbeite gern mit Menschen und ich helfe ihnen gern. Bei der Arbeit spreche ich mit meinen Kollegen oder mit den Kunden.","لا أحب التوتر لأنني أريد أن أعمل بهدوء. أحب العمل مع الناس وأحب مساعدتهم. في العمل أتحدث مع زملائي أو مع العملاء."]]);
TX("Über Interessen, Sport, Musik, Wochenendpläne und persönliche Vorlieben sprechen",[["Ich möchte über meine Hobbys sprechen.","أريد أن أتحدث عن هواياتي."],
["Ich spiele gern Fußball und höre gern Musik. Ich lese auch gern Bücher und sehe manchmal fern. Am Montag und Mittwoch spiele ich Fußball mit meinen Freunden, denn Sport macht Spaß.","أحب لعب كرة القدم والاستماع إلى الموسيقى. أحب أيضاً قراءة الكتب وأشاهد التلفاز أحياناً. يوم الاثنين والأربعاء ألعب كرة القدم مع أصدقائي لأن الرياضة ممتعة."],
["Am Freitag bleibe ich zu Hause oder gehe mit meinen Freunden spazieren. Am Samstag lese ich Bücher und höre Musik, aber ich sehe nicht viel fern.","يوم الجمعة أبقى في البيت أو أتنزّه مع أصدقائي. يوم السبت أقرأ الكتب وأستمع إلى الموسيقى، لكنني لا أشاهد التلفاز كثيراً."],
["Im Frühling gehe ich gern spazieren, denn das Wetter ist schön. Im Sommer schwimme ich gern und spiele Fußball. Im Herbst lese ich mehr Bücher, aber im Winter bleibe ich lieber zu Hause und sehe fern.","في الربيع أحب التنزّه لأن الطقس جميل. في الصيف أحب السباحة ولعب كرة القدم. في الخريف أقرأ كتباً أكثر، لكن في الشتاء أفضّل البقاء في البيت ومشاهدة التلفاز."],
["Mein Lieblingsmonat ist April, denn das Wetter ist nicht zu kalt und nicht zu heiß. Im Dezember höre ich gern Musik und verbringe Zeit mit meiner Familie.","شهري المفضل هو أبريل لأن الطقس ليس بارداً جداً ولا حارّاً جداً. في ديسمبر أحب الاستماع إلى الموسيقى وقضاء الوقت مع عائلتي."],
["Meine Hobbys sind wichtig für mich, denn ich bin gern aktiv und möchte auch Spaß haben.","هواياتي مهمة بالنسبة لي لأنني أحب أن أكون نشيطاً وأريد أيضاً أن أستمتع."]]);

function publicRankData(xpValue){
 const xp=Math.max(0,Number(xpValue)||0);
 const ranks=[{name:"الرايق",min:0,next:100},{name:"الجامد",min:100,next:300},{name:"القادر",min:300,next:600},{name:"المطرشم",min:600,next:1000},{name:"الادولف",min:1000,next:2000},{name:"القدوه",min:2000,next:Infinity}];
 let r=ranks[0];for(const item of ranks)if(xp>=item.min)r=item;
 const progress=r.next===Infinity?100:Math.min(100,Math.max(0,Math.round((xp-r.min)/(r.next-r.min)*100)));
 return {xp,rankName:r.name,rankMin:r.min,rankNext:Number.isFinite(r.next)?r.next:null,rankProgress:progress};
}
async function syncPublicProfile(){
 if(!fbUser||!db)return false;
 try{
  const ref=db.collection("publicProfiles").doc(fbUser.uid);
  // لا تستبدل نقاطًا موجودة في الملف العام بصفر من نسخة محلية قديمة.
  const snap=await ref.get();
  const publicXp=snap.exists?Number(snap.data().xp)||0:0;
  const safeXp=Math.max(Number(profile.xp)||0,publicXp);
  profile.xp=safeXp;
  try{localStorage.setItem(PROFILE_KEY,JSON.stringify({...profile}))}catch(e){}
  const publicData={uid:fbUser.uid,...publicRankData(safeXp),displayName:profile.displayName||fbUser.displayName||"لاعب ألماني",photoURL:fbUser.photoURL||"",updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  await ref.set(publicData,{merge:true});
  return true;
 }catch(e){console.error("Public profile sync failed",e);return false}
}

const PROVERB_GROUPS=[{"title":"Lernen, Fleiß und Erfolg","items":[{"n":1,"de":"Übung macht den Meister","ar":"التكرار يعلّم الشطارة.","situation":"Du lernst Deutsch, aber du machst noch viele Fehler. Dein Freund sagt: „Übe jeden Tag! Übung macht den Meister.“","translation":"إنت بتتعلم ألماني، بس لسه بتغلط كتير. صاحبك يقولك: اتدرب كل يوم! التكرار يعلّم الشطارة."},{"n":2,"de":"Ohne Fleiß kein Preis","ar":"من جدّ وجد.","situation":"Ali möchte die Prüfung bestehen, aber er lernt nicht. Seine Mutter sagt: „Ohne Fleiß kein Preis.“","translation":"علي عايز ينجح في الامتحان، لكنه مش بيذاكر. أمه تقوله: من جدّ وجد."},{"n":3,"de":"Aller Anfang ist schwer","ar":"كل بداية صعبة.","situation":"Sara lernt seit einer Woche Deutsch. Sie findet die Sprache schwer. Ihre Freundin sagt: „Keine Sorge! Aller Anfang ist schwer.“","translation":"سارة بتتعلم ألماني من أسبوع، وحاسة إن اللغة صعبة. صاحبتها تقولها: ماتقلقيش، كل بداية صعبة."},{"n":4,"de":"Es ist noch kein Meister vom Himmel gefallen","ar":"محدش اتولد متعلم.","situation":"Omar macht bei seiner ersten Präsentation viele Fehler. Sein Lehrer sagt: „Das ist normal. Es ist noch kein Meister vom Himmel gefallen.“","translation":"عمر بيغلط كتير في أول عرض تقديمي ليه. المدرس يقوله: ده طبيعي، محدش اتولد متعلم."},{"n":5,"de":"Man lernt nie aus","ar":"طول ما إنت عايش هتفضل تتعلم.","situation":"Paul arbeitet seit zwanzig Jahren als Lehrer. Trotzdem besucht er einen neuen Kurs. Er sagt: „Man lernt nie aus.“","translation":"بول شغال مدرس بقاله عشرين سنة، ومع ذلك بيدخل كورس جديد. بيقول: طول ما إحنا عايشين هنتعلم."},{"n":6,"de":"Was Hänschen nicht lernt, lernt Hans nimmermehr","ar":"التعليم في الصغر زي النقش على الحجر.","situation":"Ein Vater möchte, dass sein Sohn schon als Kind viel liest. Er sagt: „Was Hänschen nicht lernt, lernt Hans nimmermehr.“","translation":"أب عايز ابنه يتعود على القراءة من وهو صغير، وبيقول إن التعليم في الصغر زي النقش على الحجر."},{"n":7,"de":"Aus Schaden wird man klug","ar":"الغلطة بتعلّم.","situation":"Karim kauft ein Handy, ohne die Qualität zu prüfen. Später funktioniert es nicht. Beim nächsten Mal ist er vorsichtiger. Aus Schaden wird man klug.","translation":"كريم اشترى موبايل من غير ما يتأكد من جودته، وبعد كده باظ. المرة الجاية بقى حريص أكتر. الغلطة بتعلّم."},{"n":8,"de":"Wer nicht wagt, der nicht gewinnt","ar":"اللي ما يجازفش ما يكسبش.","situation":"Lina möchte sich für eine neue Stelle bewerben, aber sie hat Angst. Ihre Freundin sagt: „Versuch es! Wer nicht wagt, der nicht gewinnt.“","translation":"لينا عايزة تقدم على شغل جديد، لكنها خايفة. صاحبتها تقولها: جرّبي! اللي ما يجازفش ما يكسبش."},{"n":9,"de":"Wo ein Wille ist, ist auch ein Weg","ar":"اللي عايز حاجة بجد بيدوّر على طريقة يوصل بيها.","situation":"Ahmed möchte Deutsch lernen, obwohl er wenig Zeit hat. Er lernt jeden Tag zwanzig Minuten. Wo ein Wille ist, ist auch ein Weg.","translation":"أحمد عايز يتعلم ألماني رغم إن وقته قليل. بيذاكر كل يوم عشرين دقيقة. اللي عنده إرادة بيلقي طريقة."},{"n":10,"de":"Jeder ist seines Glückes Schmied","ar":"كل واحد بيصنع مستقبله بإيده.","situation":"Max möchte eine gute Arbeit finden. Er lernt neue Fähigkeiten und arbeitet fleißig. Er weiß: Jeder ist seines Glückes Schmied.","translation":"ماكس عايز يلاقي شغل كويس، فبيتعلم مهارات جديدة وبيجتهد. هو عارف إن كل واحد بيصنع مستقبله بإيده."}]},{"title":"Zeit, Geduld und Planung","items":[{"n":11,"de":"Zeit ist Geld","ar":"الوقت من دهب.","situation":"Ali verbringt den ganzen Tag am Handy. Er hat keine Zeit für seine Hausaufgaben. Sein Bruder sagt: „Zeit ist Geld. Nutze deine Zeit gut!“","translation":"علي بيقضي اليوم كله على الموبايل، ومش بيلاقي وقت لواجبه. أخوه يقوله: الوقت من دهب، استغل وقتك كويس!"},{"n":12,"de":"Besser spät als nie","ar":"أحسن ما تيجي متأخر عن إنك ما تجيش خالص.","situation":"Mona möchte schon lange Deutsch lernen. Sie beginnt erst mit dreißig Jahren. Ihre Freundin sagt: „Besser spät als nie!“","translation":"منى نفسها تتعلم ألماني من زمان، لكنها بدأت وهي عندها تلاتين سنة. صاحبتها تقولها: أحسن ما تبدأي متأخر عن إنك ما تبدأيش خالص!"},{"n":13,"de":"Eile mit Weile","ar":"في التأني السلامة وفي العجلة الندامة.","situation":"Paul möchte seine Arbeit schnell beenden. Er macht viele Fehler. Sein Kollege sagt: „Eile mit Weile! Arbeite lieber langsam und sorgfältig.“","translation":"بول عايز يخلص شغله بسرعة، فبيغلط كتير. زميله يقوله: في التأني السلامة، اشتغل براحة وبتركيز أحسن."},{"n":14,"de":"Der frühe Vogel fängt den Wurm","ar":"اللي يصحى بدري يلحق.","situation":"Sara steht früh auf und lernt vor der Universität Deutsch. Am Abend hat sie mehr Freizeit. Ihre Freundin sagt: „Der frühe Vogel fängt den Wurm.“","translation":"سارة بتصحى بدري وبتذاكر ألماني قبل الجامعة، فبيبقى عندها وقت فاضي بالليل. صاحبتها تقولها: اللي يصحى بدري يلحق."},{"n":15,"de":"Morgenstund hat Gold im Mund","ar":"بدري بدري، والرزق على الله.","situation":"Karim steht um sechs Uhr auf und beginnt früh mit seiner Arbeit. Er erledigt viele Aufgaben, bevor seine Kollegen kommen. Er denkt: „Morgenstund hat Gold im Mund.“","translation":"كريم بيصحى الساعة ستة وبيبدأ شغله بدري، وبيخلص مهام كتير قبل ما زمايله يوصلوا. وبيفتكر إن أول النهار فيه بركة."},{"n":16,"de":"Was du heute kannst besorgen, das verschiebe nicht auf morgen","ar":"ما تأجلش شغل النهارده لبكرة.","situation":"Ahmed muss heute seine Hausaufgaben machen. Er möchte lieber fernsehen und alles auf morgen verschieben. Seine Mutter sagt: „Was du heute kannst besorgen, das verschiebe nicht auf morgen.“","translation":"أحمد لازم يعمل واجبه النهارده، لكنه عايز يتفرج على التلفزيون ويأجل كل حاجة لبكرة. أمه تقوله: ما تأجلش شغل النهارده لبكرة."},{"n":17,"de":"Gut Ding will Weile haben","ar":"الحاجات الحلوة عايزة وقت.","situation":"Lisa lernt seit zwei Wochen Gitarre. Sie möchte schon perfekt spielen, aber das ist noch schwierig. Ihr Lehrer sagt: „Gut Ding will Weile haben.“","translation":"ليزا بتتعلم جيتار من أسبوعين، وعايزة تعزف باحتراف من دلوقتي، لكن لسه الموضوع صعب. المدرس يقولها: الحاجات الحلوة عايزة وقت."},{"n":18,"de":"Man soll den Tag nicht vor dem Abend loben","ar":"ما تقولش فول إلا لما يكمل مكيوله.","situation":"Tom glaubt, dass er die Prüfung bestanden hat, obwohl die Ergebnisse noch nicht da sind. Sein Freund sagt: „Warte erst auf das Ergebnis. Man soll den Tag nicht vor dem Abend loben.“","translation":"توم متأكد إنه نجح في الامتحان، رغم إن النتيجة لسه ما ظهرتش. صاحبه يقوله: استنى النتيجة الأول، ما تقولش فول إلا لما يكمل مكيوله."},{"n":19,"de":"Man muss das Eisen schmieden, solange es heiß ist","ar":"اضرب الحديد وهو سخن.","situation":"Nadia bekommt eine Einladung zu einem Vorstellungsgespräch. Sie bereitet sich sofort darauf vor, solange die Chance da ist. Ihre Freundin sagt: „Man muss das Eisen schmieden, solange es heiß ist.“","translation":"نادية جالها موعد لمقابلة شغل، فبدأت تستعد فورًا وهي الفرصة لسه موجودة. صاحبتها تقولها: اضربي الحديد وهو سخن."},{"n":20,"de":"Hinterher ist man immer klüger","ar":"بعد ما تقع الفاس في الراس، الكل بيبقى فاهم.","situation":"Max kauft ein gebrauchtes Fahrrad, ohne es zu prüfen. Später entdeckt er viele Probleme. Jetzt weiß er, dass er das Fahrrad vorher hätte kontrollieren sollen. Hinterher ist man immer klüger.","translation":"ماكس اشترى عجلة مستعملة من غير ما يفحصها، وبعد كده اكتشف فيها مشاكل كتير. دلوقتي عرف إنه كان لازم يفحصها الأول. بعد ما تقع الفاس في الراس، الكل بيبقى فاهم."}]},{"title":"Kommunikation und Umgang mit Menschen","items":[{"n":21,"de":"Reden ist Silber, Schweigen ist Gold","ar":"ساعات السكوت بيكون أحسن من الكلام.","situation":"Ali ist wütend und möchte seinen Freund beleidigen. Sein Bruder sagt: „Denk erst nach! Reden ist Silber, Schweigen ist Gold.“","translation":"علي متعصب وعايز يشتم صاحبه. أخوه بيقوله: «فكّر الأول! ساعات السكوت بيكون أحسن من الكلام»."},{"n":22,"de":"Der Ton macht die Musik","ar":"مش المهم تقول إيه بس، المهم تقوله إزاي.","situation":"Mona bittet ihre Schwester um Hilfe, aber sie spricht sehr unfreundlich. Ihre Mutter sagt: „Der Ton macht die Musik.“","translation":"منى بتطلب من أختها المساعدة، بس بتكلمها بطريقة مش لطيفة. أمها بتقولها: «مش المهم تطلبي إيه بس، المهم تطلبيه إزاي»."},{"n":23,"de":"Wie man in den Wald hineinruft, so schallt es heraus","ar":"عامل الناس زي ما تحب الناس تعاملك.","situation":"Paul ist immer freundlich zu seinen Kollegen. Deshalb helfen sie ihm auch gern. Sein Chef sagt: „Wie man in den Wald hineinruft, so schallt es heraus.“","translation":"بول دايمًا بيتعامل بلطف مع زمايله، وعشان كده هما كمان بيساعدوه بحب. مديره بيقول: «عامل الناس زي ما تحب الناس تعاملك»."},{"n":24,"de":"Ehrlich währt am längsten","ar":"الصراحة والأمانة هما اللي بيدوموا.","situation":"Sara macht bei der Arbeit einen Fehler. Sie möchte ihn zuerst verstecken, aber dann sagt sie die Wahrheit. Ihr Chef sagt: „Ehrlich währt am längsten.“","translation":"سارة بتغلط في الشغل، وبتفكر في الأول إنها تخبي الغلطة، لكنها بعد كده بتقول الحقيقة. مديرها بيقول: «الصراحة والأمانة هما اللي بيدوموا»."},{"n":25,"de":"Lügen haben kurze Beine","ar":"الكدب ملوش رجلين، والحقيقة هتظهر.","situation":"Ahmed sagt seiner Mutter, dass er gelernt hat. Später sieht sie, dass seine Bücher noch geschlossen sind. Sie sagt: „Lügen haben kurze Beine.“","translation":"أحمد بيقول لأمه إنه ذاكر، وبعد شوية بتكتشف إن كتبه لسه مقفولة. بتقوله: «الكذب ملوش رجلين، والحقيقة هتظهر»."},{"n":26,"de":"Wer einmal lügt, dem glaubt man nicht","ar":"اللي بيكدب مرة، الناس بتشك فيه بعد كده.","situation":"Tom erzählt seinen Freunden oft Lügen. Eines Tages sagt er die Wahrheit, aber niemand glaubt ihm. Sein Freund sagt: „Wer einmal lügt, dem glaubt man nicht.“","translation":"توم بيكدب على أصحابه كتير. في يوم بيقول الحقيقة، لكن محدش بيصدقه. صاحبه بيقوله: «اللي بيكدب مرة، الناس بتشك فيه بعد كده»."},{"n":27,"de":"Was du nicht willst, das man dir tu, das füg auch keinem andern zu","ar":"ما تعملش في غيرك حاجة إنت مش بتحبها لنفسك.","situation":"Karim macht sich über einen Mitschüler lustig. Sein Lehrer sagt: „Was du nicht willst, das man dir tu, das füg auch keinem andern zu.“","translation":"كريم بيتريق على زميله. المدرس بيقوله: «ما تعملش في غيرك حاجة إنت مش بتحبها لنفسك»."},{"n":28,"de":"In der Kürze liegt die Würze","ar":"خير الكلام ما قل ودل.","situation":"Lisa hält einen langen Vortrag. Ihr Lehrer sagt, dass sie ihre Ideen kürzer und klarer erklären soll. Er sagt: „In der Kürze liegt die Würze.“","translation":"ليزا بتقدم عرض طويل. مدرسها بيقولها إنها المفروض تشرح أفكارها بشكل أقصر وأوضح، وبيقول: «خير الكلام ما قل ودل»."},{"n":29,"de":"Hunde, die bellen, beißen nicht","ar":"اللي صوته عالي مش شرط يكون خطر.","situation":"Max hat Angst vor einem Mann, weil er immer laut spricht. Sein Freund sagt: „Keine Angst! Hunde, die bellen, beißen nicht.“","translation":"ماكس خايف من راجل عشان بيتكلم بصوت عالي دايمًا. صاحبه بيقوله: «ما تخافش! اللي صوته عالي مش شرط يكون خطر»."},{"n":30,"de":"Leben und leben lassen","ar":"كل واحد حر في حياته، وطالما مش بيأذي حد سيبه في حاله.","situation":"Anna kritisiert ihre Freundin, weil sie andere Kleidung trägt. Ihre Mutter sagt: „Leben und leben lassen.“","translation":"آنا بتنتقد صاحبتها عشان بتلبس لبس مختلف عنها. أمها بتقولها: «كل واحد حر في حياته، وطالما مش بيأذي حد سيبيه في حاله»."}]},{"title":"Freundschaft, Liebe und Beziehungen","items":[{"n":31,"de":"Ein Freund in der Not ist ein Freund in der Tat","ar":"الصاحب الجدع بيبان وقت الشدة.","situation":"Ahmed hat ein Problem und braucht Hilfe. Viele Freunde sind nicht da, aber Karim hilft ihm sofort. Ahmed sagt: „Ein Freund in der Not ist ein Freund in der Tat.“","translation":"أحمد عنده مشكلة ومحتاج مساعدة. أصحابه كتير مش موجودين، لكن كريم بيساعده فورًا. أحمد بيقول: «الصاحب الجدع بيبان وقت الشدة»."},{"n":32,"de":"Gleich und gleich gesellt sich gern","ar":"اللي شبه بعض بيرتاحوا لبعض.","situation":"Lisa und Maria lieben Bücher und Musik. Deshalb verbringen sie viel Zeit zusammen. Ihre Lehrerin sagt: „Gleich und gleich gesellt sich gern.“","translation":"ليزا وماريا بيحبوا الكتب والموسيقى، وعشان كده بيقضوا وقت كتير مع بعض. مدرستهم بتقول: «اللي شبه بعض بيرتاحوا لبعض»."},{"n":33,"de":"Gegensätze ziehen sich an","ar":"الاختلاف ساعات بيقرّب الناس من بعض.","situation":"Paul ist ruhig, aber sein Freund Max ist sehr aktiv. Trotzdem verstehen sie sich sehr gut. Paul sagt: „Gegensätze ziehen sich an.“","translation":"بول هادي، لكن صاحبه ماكس نشيط جدًا. ومع كده هما متفاهمين جدًا. بول بيقول: «الاختلاف ساعات بيقرّب الناس من بعض»."},{"n":34,"de":"Alte Liebe rostet nicht","ar":"العِشرة القديمة ما بتتنسيش بسهولة.","situation":"Nach vielen Jahren trifft Mona ihre alte Freundin wieder. Sie sprechen sofort wie früher miteinander. Mona sagt: „Alte Liebe rostet nicht.“","translation":"بعد سنين طويلة، منى بتقابل صاحبتها القديمة تاني. وبيتكلموا مع بعض كأنهم لسه شايفين بعض إمبارح. منى بتقول: «العِشرة القديمة ما بتتنسيش بسهولة»."},{"n":35,"de":"Kleine Geschenke erhalten die Freundschaft","ar":"الهدية البسيطة بتقوّي المحبة بين الناس.","situation":"Sara bringt ihrer Freundin eine kleine Schokolade mit. Ihre Freundin freut sich sehr. Sara sagt: „Kleine Geschenke erhalten die Freundschaft.“","translation":"سارة جايبة لصاحبتها قطعة شوكولاتة صغيرة. صاحبتها بتفرح جدًا. سارة بتقول: «الهدية البسيطة بتقوّي المحبة بين الناس»."},{"n":36,"de":"Geteiltes Leid ist halbes Leid","ar":"الهم لما يتقسم على اتنين بيخف.","situation":"Ali ist traurig, weil er eine Prüfung nicht bestanden hat. Sein Freund hört ihm zu und tröstet ihn. Ali sagt: „Geteiltes Leid ist halbes Leid.“","translation":"علي زعلان عشان سقط في امتحان. صاحبه بيسمعه وبيواسيه. علي بيقول: «الهم لما يتقسم على اتنين بيخف»."},{"n":37,"de":"Geteilte Freude ist doppelte Freude","ar":"الفرحة لما تشاركها مع غيرك بتكبر.","situation":"Mariam hat ihre Prüfung bestanden. Sie erzählt es ihrer Familie und feiert mit ihnen. Ihr Vater sagt: „Geteilte Freude ist doppelte Freude.“","translation":"مريم نجحت في امتحانها. بتحكي لعيلتها وبيحتفلوا معاها. أبوها بيقول: «الفرحة لما تشاركها مع غيرك بتكبر»."},{"n":38,"de":"Blut ist dicker als Wasser","ar":"رابطة الدم قوية، والأهل ليهم مكانة خاصة.","situation":"Omar hat Probleme und braucht Unterstützung. Seine Familie steht immer an seiner Seite. Er sagt: „Blut ist dicker als Wasser.“","translation":"عمر عنده مشاكل ومحتاج دعم. عيلته دايمًا واقفة جنبه. بيقول: «رابطة الدم قوية، والأهل ليهم مكانة خاصة»."},{"n":39,"de":"Abwesenheit lässt das Herz wachsen","ar":"البُعد بيخلّي الواحد يحس بقيمة اللي بيحبه ويشتاق له أكتر.","situation":"Nina wohnt seit einem Monat in einer anderen Stadt. Sie vermisst ihre beste Freundin sehr. Ihre Mutter sagt: „Abwesenheit lässt das Herz wachsen.“","translation":"نينا بقالها شهر عايشة في مدينة تانية. وحشاها صاحبتها المقرّبة جدًا. أمها بتقول: «البُعد بيخلّي الواحد يشتاق للي بيحبه أكتر»."},{"n":40,"de":"Ein Unglück kommt selten allein","ar":"المصايب بتيجي ورا بعضها.","situation":"Peter verpasst den Bus und kommt zu spät zur Arbeit. Dann merkt er, dass er seinen Schlüssel vergessen hat. Er sagt: „Ein Unglück kommt selten allein.“","translation":"بيتر بيفوّت الأتوبيس وبيتأخر عن الشغل. وبعد كده يكتشف إنه نسي المفتاح. بيقول: «المصايب بتيجي ورا بعضها»."}]},{"title":"Arbeit, Geld und Erfolg","items":[{"n":41,"de":"Ohne Arbeit kein Lohn","ar":"من غير شغل مفيش نتيجة.","situation":"Ali möchte viel Geld verdienen, aber er will nicht arbeiten. Sein Vater sagt: „Ohne Arbeit kein Lohn.“","translation":"علي عايز يكسب فلوس كتير، لكنه مش عايز يشتغل. أبوه بيقوله: «من غير شغل مفيش نتيجة»."},{"n":42,"de":"Viele Hände machen der Arbeit schnell ein Ende","ar":"إيد لوحدها ما تسقفش.","situation":"Die Schüler müssen ihre Klasse aufräumen. Jeder hilft ein bisschen, und sie sind schnell fertig. Der Lehrer sagt: „Viele Hände machen der Arbeit schnell ein Ende.“","translation":"الطلاب لازم ينضفوا فصلهم. كل واحد بيساعد بحاجة بسيطة، وبيخلصوا بسرعة. المدرس بيقول: «إيد لوحدها ما تسقفش»."},{"n":43,"de":"Erst die Arbeit, dann das Vergnügen","ar":"خلّص اللي وراك الأول وبعدين اتبسط.","situation":"Tom möchte Fußball spielen, aber er hat noch Hausaufgaben. Seine Mutter sagt: „Erst die Arbeit, dann das Vergnügen.“","translation":"توم عايز يلعب كورة، لكنه لسه مخلصش الواجب. أمه بتقوله: «خلّص اللي وراك الأول وبعدين اتبسط»."},{"n":44,"de":"Wer rastet, der rostet","ar":"اللي يبطل حركة وشغل، مستواه بيتراجع.","situation":"Herr Müller sitzt den ganzen Tag zu Hause und macht keinen Sport. Sein Freund sagt: „Geh doch spazieren! Wer rastet, der rostet.“","translation":"السيد مولر قاعد طول اليوم في البيت ومش بيمارس أي رياضة. صاحبه بيقوله: «انزل اتمشى! اللي يبطل حركة، جسمه ومستواه بيتراجعوا»."},{"n":45,"de":"Sparen ist verdienen","ar":"القرش اللي بتوفّره كأنك كسبته.","situation":"Mona kauft jeden Tag unnötige Dinge. Ihre Schwester rät ihr, etwas Geld zu sparen. Sie sagt: „Sparen ist verdienen.“","translation":"منى كل يوم بتشتري حاجات مش محتاجاها. أختها بتنصحها توفّر شوية فلوس، وبتقولها: «القرش اللي بتوفّريه كأنك كسبتيه»."},{"n":46,"de":"Geld allein macht nicht glücklich","ar":"الفلوس لوحدها مش بتجيب السعادة.","situation":"Paul verdient viel Geld, aber er hat keine Zeit für seine Familie. Sein Freund sagt: „Geld allein macht nicht glücklich.“","translation":"بول بيكسب فلوس كتير، لكنه معندوش وقت لعيلته. صاحبه بيقوله: «الفلوس لوحدها مش بتجيب السعادة»."},{"n":47,"de":"Wer billig kauft, kauft zweimal","ar":"الغالي تمنه فيه، والرخيص ساعات بيكلّفك أكتر.","situation":"Karim kauft sehr billige Kopfhörer. Nach zwei Tagen sind sie kaputt. Sein Bruder sagt: „Wer billig kauft, kauft zweimal.“","translation":"كريم بيشتري سماعة رخيصة جدًا. بعد يومين بتبوظ. أخوه بيقوله: «الرخيص ساعات بيخلّيك تدفع مرتين»."},{"n":48,"de":"Übung bringt Erfolg","ar":"بالممارسة والاجتهاد الواحد بيتحسن.","situation":"Sara übt jeden Tag Deutsch und spricht langsam immer besser. Ihre Lehrerin sagt: „Übung bringt Erfolg.“","translation":"سارة بتتدرّب على الألماني كل يوم، ومستواها بيتحسن واحدة واحدة. مدرستها بتقول: «بالممارسة والاجتهاد الواحد بيتحسن»."},{"n":49,"de":"Wer wagt, gewinnt","ar":"اللي عنده الجرأة وبيحاول، ممكن ينجح.","situation":"Ahmed hat Angst, sich für eine neue Stelle zu bewerben. Sein Freund sagt: „Versuch es einfach! Wer wagt, gewinnt.“","translation":"أحمد خايف يقدّم على وظيفة جديدة. صاحبه بيقوله: «جرّب وخلاص! اللي عنده الجرأة وبيحاول، ممكن ينجح»."},{"n":50,"de":"Rom wurde nicht an einem Tag erbaut","ar":"مفيش حاجة كبيرة بتتعمل في يوم وليلة.","situation":"Lena lernt Deutsch und möchte sofort fließend sprechen. Ihr Lehrer sagt: „Hab Geduld! Rom wurde nicht an einem Tag erbaut.“","translation":"لينا بتتعلم ألماني وعايزة تتكلم بطلاقة فورًا. مدرسها بيقولها: «اصبري! مفيش حاجة كبيرة بتتعمل في يوم وليلة»."}]},{"title":"Glück, Pech und Leben","items":[{"n":51,"de":"Jeder Tag ist ein neuer Anfang","ar":"كل يوم فرصة جديدة تبدأ من الأول.","situation":"Omar hat gestern einen Fehler gemacht. Heute möchte er es besser machen. Sein Freund sagt: „Jeder Tag ist ein neuer Anfang.“","translation":"عمر عمل غلطة امبارح، والنهارده عايز يعمل أحسن. صاحبه بيقوله: «كل يوم فرصة جديدة تبدأ من الأول»."},{"n":52,"de":"Glück im Spiel, Pech in der Liebe","ar":"محظوظ في اللعب، لكن حظه وحش في الحب.","situation":"Max gewinnt jedes Kartenspiel, aber seine Beziehungen funktionieren nicht gut. Sein Freund lacht und sagt: „Glück im Spiel, Pech in der Liebe.“","translation":"ماكس بيكسب كل لعبة كوتشينة، لكن علاقاته العاطفية مش بتنجح. صاحبه بيضحك وبيقوله: «محظوظ في اللعب، لكن حظه وحش في الحب»."},{"n":53,"de":"Jeder ist seines Glückes Schmied","ar":"كل واحد بيصنع مستقبله بإيده.","situation":"Lisa möchte eine gute Arbeit finden. Sie lernt fleißig und entwickelt ihre Fähigkeiten. Ihre Mutter sagt: „Jeder ist seines Glückes Schmied.“","translation":"ليزا عايزة تلاقي شغل كويس. بتذاكر باجتهاد وبتطوّر مهاراتها. أمها بتقولها: «كل واحد بيصنع مستقبله بإيده»."},{"n":54,"de":"Nach Regen kommt Sonnenschein","ar":"بعد الشدة بييجي الفرج.","situation":"Ahmed hat viele Probleme, aber langsam wird alles besser. Sein Bruder sagt: „Kopf hoch! Nach Regen kommt Sonnenschein.“","translation":"أحمد عنده مشاكل كتير، لكن الأمور بتتحسن واحدة واحدة. أخوه بيقوله: «ارفع راسك! بعد الشدة بييجي الفرج»."},{"n":55,"de":"Pech im Spiel, Glück in der Liebe","ar":"حظه وحش في اللعب، لكن محظوظ في الحب.","situation":"Paul verliert jedes Fußballspiel mit seinen Freunden, aber er hat eine wunderbare Familie und gute Freunde. Seine Schwester sagt: „Pech im Spiel, Glück in der Liebe.“","translation":"بول بيخسر كل ماتش كورة مع أصحابه، لكن عنده عيلة جميلة وأصحاب كويسين. أخته بتقوله: «حظه وحش في اللعب، لكن محظوظ في الحب»."},{"n":56,"de":"Unverhofft kommt oft","ar":"ساعات الحاجات اللي مش متوقعينها بتحصل فجأة.","situation":"Mona findet zufällig einen alten Freund im Supermarkt. Sie hat überhaupt nicht damit gerechnet und sagt: „Unverhofft kommt oft.“","translation":"منى بتقابل بالصدفة صاحب قديم في السوبر ماركت. مكنتش متوقعة تقابله خالص، فبتقول: «ساعات الحاجات اللي مش متوقعينها بتحصل فجأة»."},{"n":57,"de":"Ende gut, alles gut","ar":"المهم إن النهاية تكون كويسة.","situation":"Die Reise beginnt mit vielen Problemen, aber am Ende kommt die Familie sicher an und hat viel Spaß. Der Vater sagt: „Ende gut, alles gut.“","translation":"الرحلة بتبدأ بمشاكل كتير، لكن في الآخر العيلة بتوصل بالسلامة وبتتبسط جدًا. الأب بيقول: «المهم إن النهاية تكون كويسة»."},{"n":58,"de":"Man sieht sich immer zweimal im Leben","ar":"الدنيا صغيرة، وممكن تقابل نفس الشخص تاني.","situation":"Ali streitet sich mit einem Kollegen und spricht unfreundlich mit ihm. Sein Freund sagt: „Sei vorsichtig! Man sieht sich immer zweimal im Leben.“","translation":"علي بيتخانق مع زميله وبيكلمه بطريقة مش لطيفة. صاحبه بيقوله: «خلي بالك! الدنيا صغيرة، وممكن تقابل نفس الشخص تاني»."},{"n":59,"de":"Jeder Topf findet seinen Deckel","ar":"لكل واحد الشخص المناسب ليه.","situation":"Sara glaubt, dass sie nie einen Menschen finden wird, der sie versteht. Ihre Freundin sagt: „Mach dir keine Sorgen! Jeder Topf findet seinen Deckel.“","translation":"سارة فاكرة إنها مش هتلاقي أبدًا حد يفهمها. صاحبتها بتقولها: «ما تقلقيش! لكل واحد الشخص المناسب ليه»."},{"n":60,"de":"Wer zuletzt lacht, lacht am besten","ar":"العبرة بالخواتيم، واللي ينجح في الآخر هو اللي يكسب.","situation":"Einige Schüler lachen über Karim, weil er am Anfang viele Fehler macht. Am Ende besteht er die Prüfung mit einer sehr guten Note. Karim sagt: „Wer zuletzt lacht, lacht am besten.“","translation":"بعض الطلاب بيتريقوا على كريم عشان بيغلط كتير في الأول. وفي الآخر بينجح في الامتحان بدرجة عالية جدًا. كريم بيقول: «العبرة بالخواتيم، واللي ينجح في الآخر هو اللي يكسب»."}]},{"title":"Wissen, Wahrheit und Entscheidungen","items":[{"n":61,"de":"Wissen ist Macht","ar":"المعرفة قوة.","situation":"Ali liest jeden Tag Bücher und lernt neue Dinge. Er kann dadurch viele Probleme lösen. Sein Lehrer sagt: „Wissen ist Macht.“","translation":"علي بيقرأ كتب كل يوم وبيتعلم حاجات جديدة. وده بيساعده يحل مشاكل كتير. المدرس بيقوله: «المعرفة قوة»."},{"n":62,"de":"Probieren geht über Studieren","ar":"التجربة أحسن من الكلام النظري لوحده.","situation":"Mona möchte Kuchen backen, aber sie hat Angst, Fehler zu machen. Ihre Schwester sagt: „Fang einfach an! Probieren geht über Studieren.“","translation":"منى عايزة تعمل كيك، لكنها خايفة تغلط. أختها بتقولها: «ابدئي وجربي! التجربة أحسن من الكلام النظري لوحده»."},{"n":63,"de":"Irren ist menschlich","ar":"كلنا بنغلط، إحنا بشر.","situation":"Peter macht einen Fehler bei der Arbeit und entschuldigt sich. Sein Chef sagt: „Keine Sorge. Irren ist menschlich.“","translation":"بيتر بيغلط في الشغل وبيعتذر. مديره بيقوله: «ما تقلقش، كلنا بنغلط، إحنا بشر»."},{"n":64,"de":"Durch Schaden wird man klug","ar":"الغلطة بتعلّم صاحبها.","situation":"Ahmed kauft ein Handy, ohne den Preis zu vergleichen. Später findet er es viel günstiger. Er sagt: „Durch Schaden wird man klug.“","translation":"أحمد بيشتري موبايل من غير ما يقارن الأسعار. وبعد كده بيلاقيه أرخص بكتير. بيقول: «الغلطة بتعلّم صاحبها»."},{"n":65,"de":"Vertrauen ist gut, Kontrolle ist besser","ar":"الثقة كويسة، بس التأكد أحسن.","situation":"Sara bekommt eine wichtige E-Mail und glaubt, dass alle Informationen richtig sind. Ihr Kollege sagt: „Lies sie noch einmal! Vertrauen ist gut, Kontrolle ist besser.“","translation":"سارة بتستقبل إيميل مهم وبتفتكر إن كل المعلومات فيه صحيحة. زميلها بيقولها: «راجعيه مرة كمان! الثقة كويسة، بس التأكد أحسن»."},{"n":66,"de":"Aus den Augen, aus dem Sinn","ar":"البعيد عن العين بعيد عن البال.","situation":"Tom zieht in eine andere Stadt und verliert langsam den Kontakt zu einigen Bekannten. Seine Schwester sagt: „Aus den Augen, aus dem Sinn.“","translation":"توم بينتقل لمدينة تانية، ومع الوقت بيقل تواصله مع بعض معارفه. أخته بتقول: «البعيد عن العين بعيد عن البال»."},{"n":67,"de":"Wer A sagt, muss auch B sagen","ar":"اللي يبدأ حاجة لازم يكملها ويتحمّل مسؤوليتها.","situation":"Max beginnt ein großes Projekt, möchte aber nach zwei Tagen aufgeben. Sein Freund sagt: „Wer A sagt, muss auch B sagen.“","translation":"ماكس بيبدأ مشروع كبير، لكنه عايز يستسلم بعد يومين. صاحبه بيقوله: «اللي يبدأ حاجة لازم يكملها ويتحمّل مسؤوليتها»."},{"n":68,"de":"In der Ruhe liegt die Kraft","ar":"القوة في الهدوء، مش في العصبية والتسرّع.","situation":"Lena ist nervös vor einer Prüfung. Ihre Mutter sagt: „Atme tief durch! In der Ruhe liegt die Kraft.“","translation":"لينا متوترة قبل الامتحان. أمها بتقولها: «خدي نفس عميق واهدي! القوة في الهدوء»."},{"n":69,"de":"Wer die Wahl hat, hat die Qual","ar":"كتر الاختيارات ساعات بيحيّر الواحد.","situation":"Omar möchte einen Laptop kaufen. Es gibt viele gute Modelle, und er kann sich nicht entscheiden. Sein Bruder sagt: „Wer die Wahl hat, hat die Qual.“","translation":"عمر عايز يشتري لابتوب. فيه موديلات كويسة كتير، ومش عارف يختار. أخوه بيقوله: «كتر الاختيارات ساعات بيحيّر الواحد»."},{"n":70,"de":"Nicht alles, was glänzt, ist Gold","ar":"مش كل حاجة شكلها حلو تبقى حلوة فعلًا.","situation":"Mariam sieht im Internet ein sehr günstiges Angebot. Es sieht perfekt aus, aber die Bewertungen sind schlecht. Ihre Freundin sagt: „Sei vorsichtig! Nicht alles, was glänzt, ist Gold.“","translation":"مريم بتشوف عرض رخيص جدًا على الإنترنت. شكله مثالي، لكن التقييمات سيئة. صاحبتها بتقولها: «خلي بالك! مش كل حاجة شكلها حلو تبقى حلوة فعلًا»."}]},{"title":"Familie, Zuhause und Alltag","items":[{"n":71,"de":"My home is my castle","ar":"بيتي مملكتي.","situation":"Peter arbeitet den ganzen Tag und ist sehr müde. Am Abend möchte er nur zu Hause bleiben. Er sagt: „My home is my castle.“","translation":"بيتر بيشتغل طول اليوم وبيكون تعبان جدًا. بالليل عايز يقعد في البيت وبس. بيقول: «بيتي مملكتي»."},{"n":72,"de":"Wie die Mutter, so die Tochter","ar":"بنت الوز عوام.","situation":"Maria kocht sehr gut, genau wie ihre Mutter. Ihre Tante sagt: „Wie die Mutter, so die Tochter.“","translation":"ماريا بتطبخ كويس جدًا، زي أمها بالظبط. خالتها بتقول: «بنت الوز عوام»."},{"n":73,"de":"Blut ist dicker als Wasser","ar":"الأهل ليهم مكانة خاصة، ورابطة العيلة قوية.","situation":"Karim hat ein großes Problem. Seine Familie hilft ihm sofort. Er sagt: „Blut ist dicker als Wasser.“","translation":"كريم عنده مشكلة كبيرة، وعيلته بتساعده فورًا. بيقول: «الأهل ليهم مكانة خاصة، ورابطة العيلة قوية»."},{"n":74,"de":"Wie man sich bettet, so liegt man","ar":"كل واحد بيحصد نتيجة اختياراته.","situation":"Ali gibt sein ganzes Geld aus und kann am Ende seine Rechnungen nicht bezahlen. Sein Vater sagt: „Wie man sich bettet, so liegt man.“","translation":"علي بيصرف كل فلوسه، وفي الآخر مش بيقدر يدفع فواتيره. أبوه بيقوله: «كل واحد بيحصد نتيجة اختياراته»."},{"n":75,"de":"Ordnung ist das halbe Leben","ar":"النظام بيسهّل نص المشوار.","situation":"Sara findet ihre Bücher nicht, weil ihr Zimmer unordentlich ist. Ihre Mutter sagt: „Ordnung ist das halbe Leben.“","translation":"سارة مش لاقية كتبها عشان أوضتها مش مترتبة. أمها بتقولها: «النظام بيسهّل نص المشوار»."},{"n":76,"de":"Zu Hause ist es am schönsten","ar":"مفيش أحلى من البيت.","situation":"Omar macht eine lange Reise und sieht viele schöne Orte. Trotzdem freut er sich, als er nach Hause kommt. Er sagt: „Zu Hause ist es am schönsten.“","translation":"عمر بيسافر رحلة طويلة وبيشوف أماكن جميلة كتير. ومع كده بيفرح لما يرجع البيت. بيقول: «مفيش أحلى من البيت»."},{"n":77,"de":"Wie der Vater, so der Sohn","ar":"ابن الوز عوام.","situation":"Herr Müller liebt Fußball, und sein Sohn spielt auch jeden Tag Fußball. Ein Nachbar sagt: „Wie der Vater, so der Sohn.“","translation":"السيد مولر بيحب الكورة، وابنه كمان بيلعب كورة كل يوم. جارهم بيقول: «ابن الوز عوام»."},{"n":78,"de":"Ein Unglück kommt selten allein","ar":"المصايب بتيجي ورا بعضها.","situation":"Mona verschüttet ihren Kaffee. Danach fällt ihr Handy auf den Boden, und der Bus fährt ohne sie ab. Sie sagt: „Ein Unglück kommt selten allein.“","translation":"منى بتكب القهوة، وبعدها موبايلها بيقع على الأرض، والأتوبيس بيمشي من غيرها. بتقول: «المصايب بتيجي ورا بعضها»."},{"n":79,"de":"Man soll die Feste feiern, wie sie fallen","ar":"كل مناسبة وليها فرحتها، افرح بالوقت اللي عندك.","situation":"Die Familie möchte einen Geburtstag feiern, obwohl nicht alles perfekt vorbereitet ist. Der Vater sagt: „Man soll die Feste feiern, wie sie fallen.“","translation":"العيلة عايزة تحتفل بعيد ميلاد، رغم إن مش كل حاجة جاهزة بشكل مثالي. الأب بيقول: «افرحوا بالمناسبة زي ما هي، مش لازم كل حاجة تكون مثالية»."},{"n":80,"de":"Kleine Kinder, kleine Sorgen; große Kinder, große Sorgen","ar":"كل مرحلة عمرية وليها همومها.","situation":"Frau Schmidt macht sich Sorgen um ihre kleinen Kinder. Ihre Freundin sagt, dass Eltern auch später Probleme mit ihren erwachsenen Kindern haben. Sie sagt: „Kleine Kinder, kleine Sorgen; große Kinder, große Sorgen.“","translation":"المدام شميت قلقة على أولادها الصغيرين. صاحبتها بتقولها إن الأهل بيكون عندهم مشاكل مع أولادهم حتى لما يكبروا. وبتقول: «كل مرحلة عمرية وليها همومها»."}]},{"title":"Natur, Tiere und Wetter","items":[{"n":81,"de":"Der Apfel fällt nicht weit vom Stamm","ar":"ابن الوز عوام، والعيال غالبًا بيطلعوا شبه أهلهم.","situation":"Paul spielt sehr gut Klavier, genau wie sein Vater. Seine Lehrerin sagt: „Der Apfel fällt nicht weit vom Stamm.“","translation":"بول بيعزف بيانو كويس جدًا، زي أبوه بالظبط. مدرسته بتقول: «العيال غالبًا بيطلعوا شبه أهلهم»."},{"n":82,"de":"Auch ein blindes Huhn findet mal ein Korn","ar":"حتى اللي مش شاطر ممكن يحالفه الحظ مرة.","situation":"Max beantwortet eine schwierige Frage richtig, obwohl er nicht gelernt hat. Sein Freund lacht und sagt: „Auch ein blindes Huhn findet mal ein Korn.“","translation":"ماكس بيجاوب على سؤال صعب صح رغم إنه مذاكرش. صاحبه بيضحك وبيقوله: «حتى اللي مش شاطر ممكن يحالفه الحظ مرة»."},{"n":83,"de":"Wenn die Katze aus dem Haus ist, tanzen die Mäuse auf dem Tisch","ar":"لما الرقابة تغيب، كل واحد يعمل اللي على مزاجه.","situation":"Die Lehrerin verlässt kurz das Klassenzimmer. Sofort werden die Schüler laut und spielen herum. Ein Schüler sagt: „Wenn die Katze aus dem Haus ist, tanzen die Mäuse auf dem Tisch.“","translation":"المدرسة بتخرج من الفصل شوية، فالطلاب بيعلّوا صوتهم ويلعبوا. واحد منهم بيقول: «لما الرقابة تغيب، كل واحد يعمل اللي على مزاجه»."},{"n":84,"de":"Viele Köche verderben den Brei","ar":"كتر الطباخين يحرق الطبخة.","situation":"Vier Freunde wollen gemeinsam ein Gericht kochen. Jeder gibt andere Anweisungen, und das Essen schmeckt am Ende schlecht. Einer sagt: „Viele Köche verderben den Brei.“","translation":"أربعة أصحاب بيحاولوا يطبخوا أكلة مع بعض. كل واحد بيدي تعليمات مختلفة، وفي الآخر الأكل بيطلع وحش. واحد منهم بيقول: «كتر الطباخين يحرق الطبخة»."},{"n":85,"de":"Stille Wasser sind tief","ar":"الهادي وراه حاجات كتير، ومش كل حاجة بتبان من برّه.","situation":"Anna spricht nicht viel im Unterricht. Bei der Prüfung gibt sie aber sehr gute Antworten. Ihr Lehrer sagt: „Stille Wasser sind tief.“","translation":"آنا مش بتتكلم كتير في الفصل، لكن في الامتحان بتجاوب إجابات ممتازة. مدرسها بيقول: «الهادي وراه حاجات كتير»."},{"n":86,"de":"Der frühe Vogel fängt den Wurm","ar":"اللي يصحى بدري يلحق.","situation":"Tim steht früh auf und bekommt den besten Platz im Zug. Sein Freund kommt spät und muss stehen. Tim sagt: „Der frühe Vogel fängt den Wurm.“","translation":"تيم بيصحى بدري وبيلاقي أحسن مكان في القطر. صاحبه بيتأخر وبيضطر يقف. تيم بيقوله: «اللي يصحى بدري يلحق»."},{"n":87,"de":"Nach Regen kommt Sonnenschein","ar":"بعد الشدة بييجي الفرج.","situation":"Lisa hat eine schwierige Woche. Am Wochenende scheint endlich die Sonne, und sie geht mit Freunden spazieren. Sie sagt: „Nach Regen kommt Sonnenschein.“","translation":"ليزا بتمر بأسبوع صعب. في الويك إند الشمس بتطلع أخيرًا، فبتخرج تتمشى مع أصحابها. بتقول: «بعد الشدة بييجي الفرج»."},{"n":88,"de":"Eine Schwalbe macht noch keinen Sommer","ar":"نجاح واحد مش معناه إن كل حاجة بقت تمام.","situation":"Ahmed bekommt bei der ersten Prüfung eine sehr gute Note. Er hört danach auf zu lernen. Sein Lehrer sagt: „Eine Schwalbe macht noch keinen Sommer.“","translation":"أحمد بيجيب درجة ممتازة في أول امتحان، وبعدها بيبطل مذاكرة. المدرس بيقوله: «نجاح واحد مش معناه إن كل حاجة بقت تمام»."},{"n":89,"de":"Wo Rauch ist, ist auch Feuer","ar":"مفيش دخان من غير نار.","situation":"Im Büro gibt es viele Gerüchte über ein Problem. Später bestätigt der Chef, dass es tatsächlich ein Problem gibt. Ein Mitarbeiter sagt: „Wo Rauch ist, ist auch Feuer.“","translation":"في المكتب فيه كلام كتير عن وجود مشكلة. وبعد كده المدير بيأكد إن فيه فعلًا مشكلة. واحد من الموظفين بيقول: «مفيش دخان من غير نار»."},{"n":90,"de":"Den Wald vor lauter Bäumen nicht sehen","ar":"مش شايف الصورة الكبيرة من كتر التفاصيل.","situation":"Peter sucht lange nach einer Lösung und konzentriert sich auf kleine Details. Dabei übersieht er die einfache Antwort. Seine Kollegin sagt: „Du siehst den Wald vor lauter Bäumen nicht.“","translation":"بيتر بيدوّر على حل لفترة طويلة، وبيفضل مركز في التفاصيل الصغيرة. وفي وسط ده مش بياخد باله من الحل البسيط. زميلته بتقوله: «إنت مش شايف الصورة الكبيرة من كتر التفاصيل»."}]},{"title":"Entscheidungen, Fehler und Lebenserfahrung","items":[{"n":91,"de":"Wer nicht hören will, muss fühlen","ar":"اللي ما يسمعش الكلام، يتحمّل النتيجة.","situation":"Ahmeds Vater sagt ihm, dass er vorsichtig fahren soll. Ahmed hört nicht zu und bekommt später einen Strafzettel. Sein Vater sagt: „Wer nicht hören will, muss fühlen.“","translation":"أبو أحمد بيقوله يسوق بحذر، لكنه مش بيسمع الكلام، وبعد كده بياخد مخالفة. أبوه بيقوله: «اللي ما يسمعش الكلام، يتحمّل النتيجة»."},{"n":92,"de":"Gelegenheit macht Diebe","ar":"الفرصة ساعات بتغري الواحد إنه يعمل الغلط.","situation":"Ein Geschäft lässt seine Tür offen, und niemand ist an der Kasse. Ein Mann sieht das und nimmt Geld. Später sagt jemand: „Gelegenheit macht Diebe.“","translation":"محل سايب بابه مفتوح ومفيش حد عند الكاشير. راجل بيشوف ده وبيسرق فلوس. بعد كده حد بيقول: «الفرصة ساعات بتغري الواحد إنه يعمل الغلط»."},{"n":93,"de":"Wer anderen eine Grube gräbt, fällt selbst hinein","ar":"اللي يحفر حفرة لغيره، يقع فيها.","situation":"Paul versucht, seinem Kollegen zu schaden, damit er selbst befördert wird. Am Ende entdeckt der Chef die Wahrheit, und Paul bekommt Probleme. Ein Kollege sagt: „Wer anderen eine Grube gräbt, fällt selbst hinein.“","translation":"بول بيحاول يضر زميله عشان هو اللي ياخد الترقية. في الآخر المدير بيكتشف الحقيقة، وبول نفسه بيقع في مشكلة. زميله بيقوله: «اللي يحفر حفرة لغيره، يقع فيها»."},{"n":94,"de":"Lügen haben kurze Beine","ar":"الكدب ملوش رجلين، والحقيقة هتظهر.","situation":"Maria sagt, dass sie ihre Hausaufgaben gemacht hat. Ihre Lehrerin fragt sie nach den Antworten, aber Maria kann nichts erklären. Die Lehrerin sagt: „Lügen haben kurze Beine.“","translation":"ماريا بتقول إنها عملت الواجب. المدرسة بتسألها عن الإجابات، لكنها مش عارفة تشرح حاجة. المدرسة بتقولها: «الكذب ملوش رجلين، والحقيقة هتظهر»."},{"n":95,"de":"Wer A sagt, muss auch B sagen","ar":"اللي يبدأ حاجة لازم يكملها.","situation":"Max meldet sich freiwillig für ein Projekt. Nach einigen Tagen möchte er aufhören, weil die Arbeit schwierig ist. Sein Freund sagt: „Wer A sagt, muss auch B sagen.“","translation":"ماكس بيتطوع للمشاركة في مشروع، وبعد كام يوم عايز ينسحب عشان الشغل صعب. صاحبه بيقوله: «اللي يبدأ حاجة لازم يكملها»."},{"n":96,"de":"Man soll den Tag nicht vor dem Abend loben","ar":"ما تقولش فول إلا لما يكمل مكيوله.","situation":"Tom glaubt, dass er die Prüfung bestanden hat, obwohl die Ergebnisse noch nicht da sind. Seine Freundin sagt: „Warte lieber ab! Man soll den Tag nicht vor dem Abend loben.“","translation":"توم فاكر إنه نجح في الامتحان، رغم إن النتيجة لسه ما ظهرتش. صاحبته بتقوله: «استنى أحسن! ما تقولش فول إلا لما يكمل مكيوله»."},{"n":97,"de":"Was Hänschen nicht lernt, lernt Hans nimmermehr","ar":"التعليم في الصغر زي النقش على الحجر.","situation":"Der Vater möchte, dass sein Sohn schon als Kind regelmäßig liest und lernt. Er sagt: „Was Hänschen nicht lernt, lernt Hans nimmermehr.“","translation":"الأب عايز ابنه يتعود على القراءة والتعلّم من وهو صغير. بيقوله: «التعليم في الصغر زي النقش على الحجر»."},{"n":98,"de":"Morgen, morgen, nur nicht heute, sagen alle faulen Leute","ar":"بكرة إن شاء الله، وده كلام اللي بيأجل كل حاجة.","situation":"Lisa verschiebt ihre Hausaufgaben jeden Tag auf morgen. Schließlich hat sie zu viel Arbeit auf einmal. Ihr Bruder sagt: „Morgen, morgen, nur nicht heute, sagen alle faulen Leute.“","translation":"ليزا بتأجل واجبها كل يوم لبكرة، وفي الآخر بيتراكم عليها شغل كتير مرة واحدة. أخوها بيقولها: «بكرة بكرة، مش النهارده، وده كلام اللي بيكسلوا»."},{"n":99,"de":"Wer zuletzt lacht, lacht am besten","ar":"العبرة بالخواتيم.","situation":"Einige Schüler glauben, dass Karim die Prüfung nicht bestehen wird. Karim lernt fleißig und bekommt am Ende die beste Note. Er sagt: „Wer zuletzt lacht, lacht am besten.“","translation":"بعض الطلاب فاكرين إن كريم مش هينجح في الامتحان. كريم بيذاكر باجتهاد، وفي الآخر بيجيب أعلى درجة. بيقول: «العبرة بالخواتيم»."},{"n":100,"de":"Ende gut, alles gut","ar":"المهم إن النهاية تكون كويسة.","situation":"Die Familie hat auf der Reise viele Probleme. Am Ende kommen alle sicher nach Hause und sind glücklich. Der Vater sagt: „Ende gut, alles gut.“","translation":"العيلة بتواجه مشاكل كتير في الرحلة، لكن في الآخر الكل بيرجع البيت بالسلامة وبيبقوا مبسوطين. الأب بيقول: «المهم إن النهاية تكون كويسة»."}]}];
const PROVERB_ICONS=["📚","⏳","💬","🤝","💼","🍀","💡","🏠","🌦️","🧭"];
function renderSpeakLevels(){
 const h=document.createElement("h2");h.className="sec";h.textContent="أهداف المستويات";view.append(h);
 const g=document.createElement("div");g.className="grid levels";
 Object.keys(LESSONS).forEach(k=>g.append(btn(`<span class="lvl">${k}</span><small>${LEVEL_NAMES[k]}</small>`,"box lv"+k,()=>go("G",k))));
 g.append(btn('<span class="lvl">B2</span><small>فوق المتوسط</small>',"box lvB2",()=>go("G","B2")));
 view.append(g);
}
function renderLevelGoals(lv){
 title.textContent="مستوى "+lv+(LEVEL_NAMES[lv]?" · "+LEVEL_NAMES[lv]:" · فوق المتوسط");crumb.textContent="اختر القسم";
 const g=document.createElement("div");g.className="grid cats";
 g.append(btn('📖<span class="tt">الكلمات</span>'+(LESSONS[lv]?'<small style="display:block;margin-top:6px">'+pct(lv)+'% محفوظ</small>':'<small style="display:block;margin-top:6px">قريبًا</small>'),"box",()=>go(lv)));
 g.append(btn('🗣️<span class="tt">مواضيع التحدث</span>',"box",()=>go("S",lv)));
 g.append(btn('💬<span class="tt">المحادثات</span>',"box",()=>{title.textContent="المحادثات · "+lv;crumb.textContent="المحادثات";view.innerHTML='<div class="empty">المحادثات هتضاف قريبًا.</div>'}));
 if(lv==="B2") g.append(btn('📚<span class="tt">الأمثال الشعبية الألمانية</span>',"box",()=>go("PG")));
 view.append(g)}
function renderProverbGroups(){
 title.textContent="Deutsche Sprichwörter · الأمثال الشعبية";crumb.textContent="B2 · اختر مجموعة";
 view.append(btn("🧠 ابدأ تدريب الأمثال · اختار المثل المناسب للموقف","go proverb-training-start",()=>go("PQ","all")));
 const pg=document.createElement("div");pg.className="grid proverb-grid";
 PROVERB_GROUPS.forEach((group,i)=>{
  const savedCount=group.items.filter(item=>localStorage.getItem("saved-german-proverb-"+item.n)==="1").length;
  const card=btn(`<span class="proverb-card-top"><span class="proverb-group-head"><span class="proverb-group-number">${i+1}</span><span class="proverb-icon">${PROVERB_ICONS[i]}</span></span><span class="proverb-name">${group.title}</span></span><span class="proverb-card-bottom"><span class="proverb-card-exam" data-proverb-exam="${i}">✎ امتحان</span><span class="proverb-card-progress">📈 ${savedCount}/${group.items.length} محفوظ</span></span>`,"proverb-card",()=>go("P",i));
  const exam=card.querySelector("[data-proverb-exam]");
  exam.addEventListener("click",ev=>{ev.stopPropagation();go("PQ",i)});
  pg.append(card);
 });
 view.append(pg)
}
function renderProverbQuiz(groupIndex){
 const all=PROVERB_GROUPS.flatMap((g,gi)=>g.items.map(item=>({...item,groupIndex:gi})));
 const pool=groupIndex==="all"?all:(PROVERB_GROUPS[Number(groupIndex)]||{items:[]}).items.map(item=>({...item,groupIndex:Number(groupIndex)}));
 if(!pool.length){view.innerHTML='<div class="empty">مفيش أمثال متاحة للتدريب هنا.</div>';return}
 title.textContent="تدريب الأمثال";crumb.textContent=groupIndex==="all"?"كل الأمثال · اختر المثل المناسب للموقف":PROVERB_GROUPS[Number(groupIndex)].title+" · تدريب";
 let questions=pool.slice().sort(()=>Math.random()-.5).slice(0,10),idx=0,score=0,answered=false;
 const box=document.createElement("div");box.className="proverb-item";view.append(box);
 function showQuestion(){
  box.innerHTML="";answered=false;
  if(idx>=questions.length){

const CHALLENGE_EXPIRY_MS=2*24*60*60*1000;

async function expireStaleChallenges(docs){
 let changed=0;
 for(const d of docs){const c=d.data();if(!isChallengeStale(c))continue;
  try{await d.ref.update({status:"declined",declinedAt:firebase.firestore.FieldValue.serverTimestamp(),winnerUid:c.challengerUid,winnerReason:"expired"});changed++}
  catch(e){console.warn("Could not auto-expire challenge (check Firestore rules)",e)}}
 return changed}

 const makeMeaning=(w)=>{
  const pool=seededShuffle([...new Set(words.map(x=>x.ar).filter(x=>x&&x!==w.ar))],rng);

 };
 words.forEach(w=>{
  if(w.ar)makeMeaning(w);
  if("mfn".includes(w.c)){
   const noun=w.de.replace(/^(der|die|das)\s+/i,"");
   const options=seededShuffle(["der","die","das"],rng);
   types.article.push({type:"article",word:w.de,prompt:noun,options,answer:options.indexOf({m:"der",f:"die",n:"das"}[w.c]),promptDir:"ltr"});

 });

  const preferred=qs.length%2===0?"meaning":"article";
