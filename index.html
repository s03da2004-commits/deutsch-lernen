<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الألماني</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1f26;--mute:#6a707c;--line:#dcd8cf;
--m:#1d5fd1;--f:#d62839;--n:#1f9d55;--v:#111;--a:#7b3fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1e222a;--ink:#eef0f4;--mute:#9aa1ae;--line:#323845;--m:#5b9bff;--f:#ff6b7a;--n:#4cd08a;--v:#f2f2f2;--a:#b58cff}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1e222a;--ink:#eef0f4;--mute:#9aa1ae;--line:#323845;--m:#5b9bff;--f:#ff6b7a;--n:#4cd08a;--v:#f2f2f2;--a:#b58cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Cairo,Tahoma,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px}
:focus-visible{outline:3px solid var(--m);outline-offset:3px}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:900;flex:1}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 16px;font:700 15px Cairo,sans-serif;cursor:pointer}
.crumb{color:var(--mute);margin:0 0 22px;font-size:15px}
.grid{display:grid;gap:14px}
.levels{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lessons{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.cats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--ink);font:700 18px Cairo,sans-serif}
.box:hover{border-color:var(--ink)}
.lvl{font-size:56px;font-weight:900;display:block;line-height:1.1}
.lvl+small{color:var(--mute);font-weight:500}
.num{display:block;color:var(--mute);font-size:14px;font-weight:500}
.cat{border-width:2px;border-color:currentColor}
.words{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.w{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
.w .de{direction:ltr;text-align:right;font-size:24px;font-weight:700}
.w .ar{color:var(--mute);font-size:16px}
.spk{width:42px;height:42px;border-radius:50%;border:0;background:currentColor;cursor:pointer;display:grid;place-items:center;flex:none}
.spk svg{fill:var(--card);width:22px;height:22px}
.m{color:var(--m)}.f{color:var(--f)}.n{color:var(--n)}.v{color:var(--v)}.a{color:var(--a)}
.empty{color:var(--mute);background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.w{flex-wrap:wrap}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:0;flex:1;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-width:0}
.row .ar::after{content:" \25BE";font-size:13px}
.open .row .ar::after{content:" \25B4"}
.ex{display:none;flex-basis:100%;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--mute)}
.open .ex{display:grid}
.exde{direction:ltr;text-align:left;font-size:20px;font-weight:600;color:var(--ink)}
.exar{grid-column:1;color:var(--mute);font-size:15px}
.spk.sm{grid-row:1/3;grid-column:2;width:34px;height:34px}
.spk.sm svg{width:18px;height:18px}
.pct{display:block;font-size:20px;font-weight:700;margin-top:8px}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--n)}
.go{display:block;width:100%;margin:18px 0;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 17px Cairo,sans-serif;cursor:pointer}
.go.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.qbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:28px 16px;text-align:center;font-size:32px;font-weight:900;margin-bottom:16px}
.qbox.de{direction:ltr}
.box.ok{background:var(--n);border-color:var(--n);color:#fff}
.box.bad{background:var(--f);border-color:var(--f);color:#fff}
.pin{display:block;width:100%;padding:14px;font:700 22px Cairo,sans-serif;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:left}
.fb{padding:12px;border-radius:10px;margin-top:10px;font-weight:700;text-align:center;direction:ltr}
.fb:empty{display:none}
.fb.ok{background:var(--n);color:#fff}
.fb.bad{background:var(--f);color:#fff}
.tile{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.t1{background:none;border:0;padding:16px 12px;color:var(--ink);font:700 18px Cairo,sans-serif;cursor:pointer;text-align:center}
.t1:hover{background:var(--bg)}
.t2{padding:8px 12px;border-top:1px solid var(--line);text-align:center}
.t3{border:0;border-top:1px solid var(--line);padding:10px;background:var(--ink);color:var(--bg);font:700 15px Cairo,sans-serif;cursor:pointer}
.sec{margin:34px 0 12px;font-size:22px;font-weight:900}
.topic{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;text-align:start}
.topic .tt{direction:ltr;font-size:19px;font-weight:700}
.topic .lv{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 10px;font-size:14px}
.topic small{flex-basis:100%;color:var(--mute);font-weight:500;font-size:14px;line-height:1.5}
.pl{font-size:14px;color:var(--mute);font-weight:500}
.lvA1{background:#FFCE00;border-color:#FFCE00;color:#111}
.lvA2{background:#DD0000;border-color:#DD0000;color:#fff}
.lvB1{background:#000;border-color:#000;color:#fff}
@media (prefers-color-scheme:dark){.lvB1{border-color:#777}}
.lvA1 small,.lvA2 small,.lvB1 small{color:inherit;opacity:.85}
.lvA1 .bar{background:rgba(0,0,0,.22)}.lvA1 .bar i{background:#111}
.lvA2 .bar,.lvB1 .bar{background:rgba(255,255,255,.3)}.lvA2 .bar i,.lvB1 .bar i{background:#fff}
.lvA1 .lv{background:#111;color:#FFCE00}
.lvA2 .lv{background:#fff;color:#DD0000}
.lvB1 .lv{background:#fff;color:#000}
.lvA1:hover,.lvA2:hover,.lvB1:hover{filter:brightness(1.08)}
.para{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.prow{display:flex;gap:12px;align-items:flex-start}
.pde{flex:1;direction:ltr;text-align:left;font-size:20px;font-weight:600;margin:0 0 8px;line-height:1.7}
.par{margin:0;color:var(--mute);font-size:16px;line-height:1.8;border-top:1px dashed var(--line);padding-top:8px}
.welcome{min-height:72vh;display:grid;place-items:center}
.wbox{width:min(78vw,340px);aspect-ratio:1;border-radius:22px;border:3px solid #FFCE00;background:#111;color:#FFCE00;font:900 clamp(28px,8vw,42px) Cairo,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;line-height:1.5;text-align:center;padding:16px}
.wbox small{font-size:14px;font-weight:500;color:#fff;opacity:.8}
.chk{order:-1;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:20px;line-height:1;cursor:pointer;flex:none}
.chk[aria-pressed="true"]{background:var(--n);border-color:var(--n);color:#fff}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.name-edit{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.name-edit:hover{border-color:var(--n)}
.rank-card{background:var(--ink);color:var(--bg);border-radius:14px;padding:20px;margin:12px 0 18px}
.rank-name{font-size:28px;font-weight:900;margin:0}
.xp-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.dash-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px;text-align:center}
.stat strong{display:block;font-size:28px;line-height:1.3}
.stat span{color:var(--mute);font-size:14px}
.dash-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dash-list li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.progress-row{display:grid;grid-template-columns:85px 1fr 36px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.progress-row .bar{margin:0}

.social-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.social-card h2,.social-card h3{margin:0 0 8px;font-size:20px}
.social-muted{color:var(--mute);font-size:14px;margin:4px 0 10px}
.social-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.social-actions button{flex:1 1 130px}
.social-input,.social-select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 16px Cairo,sans-serif;margin:5px 0 10px}
.social-person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.social-person:last-child{border-bottom:0}
.social-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;flex:none}
.social-person-main{flex:1;min-width:0;overflow-wrap:anywhere}
.social-person-main strong{display:block}
.social-person-main small{color:var(--mute)}
.challenge-timer{font-size:22px;font-weight:900;text-align:center;margin:8px 0}
.challenge-choice{direction:auto;text-align:center;overflow-wrap:anywhere}
.challenge-result{font-size:22px;font-weight:900;text-align:center;padding:16px}
</style>
</head>

TX("Essen und Trinken",[["Ich möchte über mein Essen und meine Getränke sprechen.","أريد أن أتحدث عن طعامي ومشروباتي."],
["Zum Frühstück esse ich gern Brot, Käse und Eier. Ich trinke meistens Tee mit Milch. Zum Mittagessen esse ich gern Reis mit Fleisch oder Hähnchen. Manchmal esse ich auch Nudeln. Ich trinke Wasser oder Orangensaft.","على الفطور أحب أن آكل خبزاً وجبناً وبيضاً. أشرب غالباً شاياً بالحليب. على الغداء أحب أن آكل أرزاً مع لحم أو دجاج. أحياناً آكل مكرونة أيضاً. أشرب ماءً أو عصير برتقال."],
["Am Abend esse ich gern Sandwiches mit Käse oder einen Hamburger. Mein Lieblingsessen ist Pizza, denn sie schmeckt sehr gut. Zwischen den Mahlzeiten esse ich gern Obst, besonders Äpfel und Bananen. Manchmal esse ich auch Schokolade oder Kekse.","في المساء أحب أن آكل ساندويتشات بالجبن أو همبرغر. طعامي المفضل هو البيتزا لأن طعمها لذيذ جداً. بين الوجبات أحب أن آكل الفاكهة، خصوصاً التفاح والموز. أحياناً آكل الشوكولاتة أو البسكويت أيضاً."],
["Mein Lieblingsgetränk ist Orangensaft, aber ich trinke auch gern Wasser, Tee und Milch. Cola trinke ich manchmal, aber nicht jeden Tag. Am Wochenende esse ich manchmal mit meiner Familie im Restaurant. Wir essen zusammen und trinken Saft. Ich esse gern mit meiner Familie, denn das macht Spaß.","مشروبي المفضل هو عصير البرتقال، لكنني أحب أيضاً شرب الماء والشاي والحليب. أشرب الكولا أحياناً لكن ليس كل يوم. في عطلة نهاية الأسبوع آكل أحياناً مع عائلتي في مطعم. نأكل معاً ونشرب عصيراً. أحب الأكل مع عائلتي لأن ذلك ممتع."]]);
TX("Den eigenen Beruf, den Arbeitsplatz",[["Ich arbeite in einer Firma und meine Arbeit ist interessant.","أعمل في شركة وعملي مثير للاهتمام."],
["Mein Chef ist nett und freundlich, aber er ist manchmal streng. Meine Kollegen sind auch nett und wir helfen uns.","مديري لطيف وودود لكنه أحياناً صارم. زملائي أيضاً لطفاء ونساعد بعضنا."],
["Ich spreche jeden Tag mit vielen Kunden und ich helfe ihnen gern. Die Kunden sind meistens freundlich, aber manchmal sind sie nicht zufrieden.","أتحدث كل يوم مع عملاء كثيرين وأحب مساعدتهم. العملاء ودودون في الغالب لكنهم أحياناً لا يكونون راضين."],
["Für mich ist Freundlichkeit sehr wichtig und ich möchte gute Kollegen haben. Geld ist auch wichtig, aber es ist nicht alles. Ich möchte genug Freizeit haben und meine Arbeit gern machen.","بالنسبة لي اللطف مهم جداً وأريد أن يكون لدي زملاء جيدون. المال مهم أيضاً لكنه ليس كل شيء. أريد أن يكون لدي وقت فراغ كافٍ وأن أحب عملي."],
["Ich mag Stress nicht, denn ich möchte ruhig arbeiten. Ich arbeite gern mit Menschen und ich helfe ihnen gern. Bei der Arbeit spreche ich mit meinen Kollegen oder mit den Kunden.","لا أحب التوتر لأنني أريد أن أعمل بهدوء. أحب العمل مع الناس وأحب مساعدتهم. في العمل أتحدث مع زملائي أو مع العملاء."]]);
TX("Über Interessen, Sport, Musik, Wochenendpläne und persönliche Vorlieben sprechen",[["Ich möchte über meine Hobbys sprechen.","أريد أن أتحدث عن هواياتي."],
["Ich spiele gern Fußball und höre gern Musik. Ich lese auch gern Bücher und sehe manchmal fern. Am Montag und Mittwoch spiele ich Fußball mit meinen Freunden, denn Sport macht Spaß.","أحب لعب كرة القدم والاستماع إلى الموسيقى. أحب أيضاً قراءة الكتب وأشاهد التلفاز أحياناً. يوم الاثنين والأربعاء ألعب كرة القدم مع أصدقائي لأن الرياضة ممتعة."],
["Am Freitag bleibe ich zu Hause oder gehe mit meinen Freunden spazieren. Am Samstag lese ich Bücher und höre Musik, aber ich sehe nicht viel fern.","يوم الجمعة أبقى في البيت أو أتنزّه مع أصدقائي. يوم السبت أقرأ الكتب وأستمع إلى الموسيقى، لكنني لا أشاهد التلفاز كثيراً."],
["Im Frühling gehe ich gern spazieren, denn das Wetter ist schön. Im Sommer schwimme ich gern und spiele Fußball. Im Herbst lese ich mehr Bücher, aber im Winter bleibe ich lieber zu Hause und sehe fern.","في الربيع أحب التنزّه لأن الطقس جميل. في الصيف أحب السباحة ولعب كرة القدم. في الخريف أقرأ كتباً أكثر، لكن في الشتاء أفضّل البقاء في البيت ومشاهدة التلفاز."],
["Mein Lieblingsmonat ist April, denn das Wetter ist nicht zu kalt und nicht zu heiß. Im Dezember höre ich gern Musik und verbringe Zeit mit meiner Familie.","شهري المفضل هو أبريل لأن الطقس ليس بارداً جداً ولا حارّاً جداً. في ديسمبر أحب الاستماع إلى الموسيقى وقضاء الوقت مع عائلتي."],
["Meine Hobbys sind wichtig für mich, denn ich bin gern aktiv und möchte auch Spaß haben.","هواياتي مهمة بالنسبة لي لأنني أحب أن أكون نشيطاً وأريد أيضاً أن أستمتع."]]);
